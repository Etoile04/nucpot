function realEnv(d){
  const parts=(d.cond||[]).map(function(c){return [c.T?("T="+c.T+"K"):null,c.P?("P="+c.P):null,c.E].filter(Boolean).join(" ")}).filter(Boolean);

}

function decorate(){
  const lowOn=document.getElementById('demo-low').checked;
  const condOn=document.getElementById('demo-cond').checked;
  let seed=7;const rnd=function(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
  const rows=DATA.map(function(d,i){return Object.assign({},d,{
    c: lowOn&&rnd()<0.12? +(0.3+rnd()*0.25).toFixed(2): d.c,
    demoLow: lowOn&&rnd()<0.12,
    comp: condOn? DEMO_COMPS[i%DEMO_COMPS.length] : null,
    env:  condOn? "T="+DEMO_TEMPS[i%DEMO_TEMPS.length]+"K" : realEnv(d),
    demoC: condOn})});
  const cnt={};rows.forEach(function(r){const k=r.n+'|'+r.v;cnt[k]=(cnt[k]||0)+1});
  rows.forEach(function(r){r.dup=cnt[r.n+'|'+r.v]>1?cnt[r.n+'|'+r.v]:0});
  return rows;
}
function statusOf(r){ return r.c<0.6?'待校对':(r.dup>1?'重复待甄别':'已入表') }
function compKey(s){ if(!s) return null; if(s==='undoped') return 0; const m=s.match(/(\\d+)/); return m?+m[1]:999 }
function envKey(s){ if(!s) return null; const m=s.match(/T=(\\d+)/); return m?+m[1]:9999 }
function setSort(k){ if(SORT.key===k){SORT.dir=-SORT.dir}else{SORT.key=k;SORT.dir=1} render() }
function sortArrow(k){ return SORT.key===k?(SORT.dir===1?' ▲':' ▼'):'' }
function applyView(rows){
  let out=rows.map(function(d,i){return {d:d,i:i}});
  const F=FILTER;
  if(F.n) out=out.filter(function(o){return o.d.n===F.n});
  if(F.comp==='__miss__') out=out.filter(function(o){return !o.d.comp});
  else if(F.comp) out=out.filter(function(o){return o.d.comp===F.comp});
  if(F.env==='__miss__') out=out.filter(function(o){return !o.d.env});
  else if(F.env==='__has__') out=out.filter(function(o){return !!o.d.env});
  if(F.status) out=out.filter(function(o){return statusOf(o.d)===F.status});
  const k=SORT.key, dir=SORT.dir;
  const keyf={n:function(d){return d.n}, v:function(d){return parseFloat(d.v)||0}, comp:function(d){return compKey(d.comp)}, env:function(d){return envKey(d.env)}, c:function(d){return d.c}}[k];
  out.sort(function(a,b){
    const ka=keyf(a.d), kb=keyf(b.d);
    const na=(ka===null||ka===undefined), nb=(kb===null||kb===undefined);
    if(na&&nb) return 0; if(na) return 1; if(nb) return -1;
    return (ka<kb?-1:ka>kb?1:0)*dir;
  });
  return out;
}

    '<span class="text-slate-400">筛选:</span>'+
    '<select onchange="setF(\'n\',this.value)">'+opts(props.map(function(p){return NAME_CN[p]||p}), FILTER.n, '属性:全部')+'</select>'+
    '<select onchange="setF(\'comp\',this.value)"><option value="">成分:全部</option><option value="__miss__"'+(FILTER.comp==='__miss__'?' selected':'')+'>⚠ 缺失</option>'+comps.map(function(x){return '<option'+(x===FILTER.comp?' selected':'')+'>'+x+'</option>'}).join('')+'</select>'+
    '<select onchange="setF(\'env\',this.value)"><option value="">环境:全部</option><option value="__miss__"'+(FILTER.env==='__miss__'?' selected':'')+'>⚠ 缺失</option><option value="__has__"'+(FILTER.env==='__has__'?' selected':'')+'>有条件</option></select>'+
    '<select onchange="setF(\'status\',this.value)"><option value="">状态:全部</option>'+['待校对','重复待甄别','已入表'].map(function(s){return '<option'+(s===FILTER.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'+
    '<button onclick="clearF()" class="px-2 py-0.5 rounded bg-slate-700 hover:bg-slate-600">清除</button></div>';
}
function renderA(){
  const rows=decorate();
  const view=applyView(rows);
  const groups={};rows.forEach(function(d){(groups[d.n]=groups[d.n]||[]).push(d)});
  const stats=Object.entries(groups).map(function(e){return '<span class="badge bg-slate-700 mr-1">'+(NAME_CN[e[0]]||e[0])+' ×'+e[1].length+'</span>'}).join('');
  document.getElementById('app').innerHTML=
   '<div class="bg-slate-900 rounded-xl border border-slate-700 p-5">'+
     '<div class="flex justify-between items-baseline flex-wrap gap-2"><h2 class="font-bold text-lg">Owen 2023 · amorphous UO2(未掺杂/Cr 掺杂系列)</h2><div>'+stats+'</div></div>'+
     '<p class="text-xs text-slate-400 mt-1">多值原因:论文为「成分(0–50 at.%Cr)× 温度」矩阵 · 成分与环境条件分列 · 表头点击排序 · 点击行进校对视图 · <b id="cnt">显示 '+view.length+' / '+rows.length+'</b></p>'+
     filterBar(rows)+
     '<table class="w-full mt-3 text-sm"><thead><tr class="text-left text-xs text-slate-400 border-b border-slate-700">'+
       '<th class="py-2 sortable" onclick="setSort(\'n\')">属性'+sortArrow('n')+'</th>'+
       '<th class="sortable" onclick="setSort(\'v\')">数值'+sortArrow('v')+'</th>'+
       '<th>单位</th>'+
       '<th class="sortable" onclick="setSort(\'comp\')">成分'+sortArrow('comp')+'</th>'+
       '<th class="sortable" onclick="setSort(\'env\')">环境条件'+sortArrow('env')+'</th>'+
       '<th class="sortable" onclick="setSort(\'c\')">置信度'+sortArrow('c')+'</th>'+
       '<th>状态</th></tr></thead><tbody>'+
     view.map(function(o){const d=o.d,i=o.i;
       return '<tr class="border-b border-slate-800 hover:bg-slate-800 cursor-pointer"'+(d.c<0.6?' style="background:rgba(217,119,6,.06)"':'')+' onclick="openDrawer(DATA['+i+'], '+i+')">'+
         '<td class="py-1.5">'+(NAME_CN[d.n]||d.n)+(d.dup>1?' <span class="badge bg-red-800 text-white">×'+d.dup+'</span>':'')+'</td>'+
         '<td class="font-mono text-blue-300">'+fmt(d.v)+'</td><td class="text-slate-400">'+d.u+'</td>'+
         '<td class="text-xs">'+(d.comp?'<span class="'+(d.demoC?'text-sky-400':'')+'">'+d.comp+'</span>':'<span class="condmiss">⚠ 缺失</span>')+'</td>'+
         '<td class="text-xs">'+(d.env?'<span class="'+(d.demoC?'text-sky-400':'')+'">'+d.env+'</span>':'<span class="condmiss">⚠ 缺失</span>')+'</td>'+
         '<td><span class="conf-bar"><span class="conf-fill" style="width:'+(d.c*100)+'%;background:'+confColor(d.c)+'"></span></span> <span class="text-xs">'+d.c+'</span></td>'+
         '<td>'+(statusOf(d)==='待校对'?'<span class="badge bg-orange-600 text-white">待校对</span>':(statusOf(d)==='重复待甄别'?'<span class="badge bg-red-800 text-white">重复待甄别</span>':'<span class="badge bg-emerald-800 text-slate-300">已入表</span>'))+'</td></tr>'}).join('')+
     '</tbody></table>'+
     '<p class="text-[11px] text-slate-500 mt-2">真实数据:conditions 记录 40/92 存在但 temperature/pressure/environment 全为 null;成分维度在历史碎片合并时整体丢失 → 两列普遍缺失是<b class="text-orange-400">数据侧事实</b>;勾选「示例条件预览」看补齐后形态。</p></div>';
}
function renderB(){
  const rows=decorate();
  const groups={};rows.forEach(function(r){(groups[r.n]=groups[r.n]||[]).push(r)});
  const cx=340,cy=250,R=170;const keys=Object.keys(groups);
  const nodes=keys.map(function(k,i){const a=-Math.PI/2+i*2*Math.PI/keys.length;return {k:k,x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}});
  window.__pick=function(k){const list=groups[k].slice().sort(function(a,b){return b.c-a.c});
    document.getElementById('sidebar').innerHTML='<div class="flex justify-between items-baseline"><h3 class="font-bold text-blue-300">'+(NAME_CN[k]||k)+' <span class="text-xs text-slate-400">×'+list.length+'</span></h3><span class="text-xs text-slate-500">按置信度</span></div>'+
    list.map(function(d){const idx=DATA.indexOf(d);
      return '<div class="mt-2 p-2 rounded bg-slate-800 hover:bg-slate-700 cursor-pointer'+(d.c<0.6?' border border-orange-700':'')+'" onclick="openDrawer(DATA['+idx+'], '+idx+')">'+
      '<div class="flex justify-between"><span class="font-mono text-blue-300">'+fmt(d.v)+' '+d.u+'</span>'+
      '<span class="conf-bar"><span class="conf-fill" style="width:'+(d.c*100)+'%;background:'+confColor(d.c)+'"></span></span></div>'+
      '<div class="text-[11px] mt-0.5 '+(d.comp?(d.demoC?'text-sky-400':'text-slate-400'):'condmiss')+'">'+(d.comp?'成分 '+d.comp:'⚠ 成分缺失')+'</div>'+
      '<div class="text-[11px] '+(d.env?(d.demoC?'text-sky-400':'text-slate-400'):'condmiss')+'">'+(d.env?'环境 '+d.env:'⚠ 环境缺失')+'</div></div>'}).join('')};
  document.getElementById('app').innerHTML=
   '<div class="grid grid-cols-[1fr_340px] gap-4">'+
     '<div class="bg-slate-900 rounded-xl border border-slate-700 p-4"><h2 class="font-bold mb-1">材料图谱视图(主形态)</h2>'+
     '<p class="text-xs text-slate-400 mb-2">中心=材料 · 卫星=属性类型 · 点击属性节点列值(成分/环境分行列出)</p>'+
     '<svg viewBox="0 0 680 500" class="w-full">'+
     nodes.map(function(n){return '<line x1="'+cx+'" y1="'+cy+'" x2="'+n.x+'" y2="'+n.y+'" stroke="#334155" stroke-width="1.5"/>'}).join('')+
     '<circle cx="'+cx+'" cy="'+cy+'" r="62" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>'+
     '<text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle" style="fill:#93c5fd;font-size:12px;font-weight:600">amorphous UO2</text>'+
     '<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" style="font-size:9px">undoped + 0–50 at.%Cr</text>'+
     '<text x="'+cx+'" y="'+(cy+26)+'" text-anchor="middle" style="font-size:9px">Owen 2023</text>'+
     nodes.map(function(n){return '<g transform="translate('+n.x+','+n.y+')" style="cursor:pointer" onclick="__pick(\''+n.k+'\')">'+
       '<circle r="34" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>'+
       '<text y="-2" text-anchor="middle" style="fill:#bbf7d0;font-size:10px">'+NAME_CN[n.k]+'</text>'+
       '<text y="12" text-anchor="middle">×'+groups[n.k].length+'</text></g>'}).join('')+
     '</svg></div>'+
     '<div id="sidebar" class="bg-slate-900 rounded-xl border border-slate-700 p-4 text-sm"><p class="text-slate-400 text-xs">← 点击属性节点<br>每值分行列出成分/环境;缺失橙色警示</p></div></div>';
}
function setLayout(l){layout=l;history.replaceState(null,'','?layout='+l);render()}
function render(){
  document.getElementById('btn-a').className='px-4 py-2 font-semibold '+(layout==='a'?'bg-blue-600 text-white':'text-slate-300');
  document.getElementById('btn-b').className='px-4 py-2 font-semibold '+(layout==='b'?'bg-blue-600 text-white':'text-slate-300');
  layout==='a'?renderA():renderB();
}
render();
</script>
</body>
</html>
