  const groups={};rows.forEach(function(r){(groups[r.n]=groups[r.n]||[]).push(r)});
  const cx=340,cy=250,R=170;const keys=Object.keys(groups);
  const nodes=keys.map(function(k,i){const a=-Math.PI/2+i*2*Math.PI/keys.length;return {k:k,x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}});
  window.__pick=function(k){const list=groups[k];
    document.getElementById('sidebar').innerHTML='<div class="flex justify-between items-baseline"><h3 class="font-bold text-blue-300">'+(NAME_CN[k]||k)+' <span class="text-xs text-slate-400">×'+list.length+'</span></h3></div>'+
    list.map(function(d){const idx=DATA.indexOf(d);const ct=condText(d,idx);
      return '<div class="mt-2 p-2 rounded bg-slate-800 hover:bg-slate-700 cursor-pointer'+(d.c<0.6?' border border-orange-700':'')+'" onclick="openDrawer(DATA['+idx+'], '+idx+')">'+
      '<div class="flex justify-between"><span class="font-mono text-blue-300">'+fmt(d.v)+' '+d.u+'</span>'+
      '<span class="conf-bar"><span class="conf-fill" style="width:'+(d.c*100)+'%;background:'+confColor(d.c)+'"></span></span></div>'+
      '<div class="text-[11px] mt-0.5 '+(ct.txt?(ct.demo?'text-sky-400':'text-slate-400'):'condmiss')+'">'+(ct.txt?ct.txt+(ct.demo?' ·示例':''):'⚠ 条件缺失')+'</div></div>'}).join('')};
  document.getElementById('app').innerHTML=
   '<div class="grid grid-cols-[1fr_340px] gap-4">'+
     '<div class="bg-slate-900 rounded-xl border border-slate-700 p-4"><h2 class="font-bold mb-1">材料图谱视图(主形态)</h2>'+
     '<p class="text-xs text-slate-400 mb-2">中心=材料 · 卫星=属性类型 · 点击属性节点列值(值下挂测量条件)</p>'+
     '<svg viewBox="0 0 680 500" class="w-full">'+
     nodes.map(function(n){return '<line x1="'+cx+'" y1="'+cy+'" x2="'+n.x+'" y2="'+n.y+'" stroke="#334155" stroke-width="1.5"/>'}).join('')+
     '<circle cx="'+cx+'" cy="'+cy+'" r="62" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>'+
     '<text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle" style="fill:#93c5fd;font-size:12px;font-weight:600">amorphous UO2</text>'+
     '<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" style="font-size:9px">undoped + 0–50 at.%Cr</text>'+
     '<text x="'+cx+'" y="'+(cy+26)+'" text-anchor="middle" style="font-size:9px">Owen 2023</text>'+
     nodes.map(function(n){return '<g transform="translate('+n.x+','+n.y+')" style="cursor:pointer" onclick="__pick(\''+n.k+'\')">'+
       '<circle r="34" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>'+
       '<text y="-2" text-anchor="middle" style="fill:#bbf7d0;font-size:10px">'+NAME_CN[n.k]+'</text>'+
       '<text y="12" text-anchor="middle">×'+groups[n.k].length+'</text></g>'}).join('')+
     '</svg></div>'+
     '<div id="sidebar" class="bg-slate-900 rounded-xl border border-slate-700 p-4 text-sm"><p class="text-slate-400 text-xs">← 点击属性节点<br>每值下挂测量条件;条件缺失橙色警示</p></div></div>';
}
function setLayout(l){layout=l;history.replaceState(null,'','?layout='+l);render()}
function render(){
  document.getElementById('btn-a').className='px-4 py-2 font-semibold '+(layout==='a'?'bg-blue-600 text-white':'text-slate-300');
  document.getElementById('btn-b').className='px-4 py-2 font-semibold '+(layout==='b'?'bg-blue-600 text-white':'text-slate-300');
  layout==='a'?renderA():renderB();
}
render();
</script>
</body>
</html>
