# E2E test infrastructure for NFM-2029
#
# 1 Hub node + 4 Resource nodes simulating the 1+N distributed architecture.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up --build -d
#   docker compose -f docker-compose.e2e.yml exec hub pytest tests/e2e/ -v
#   docker compose -f docker-compose.e2e.yml down -v
#
# NOTE: The primary E2E tests (tests/e2e/) use ASGI transport + in-memory
# SQLite and do NOT require Docker. This compose file is provided for
# infrastructure-level validation and optional full-network simulation.

services:
  hub:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nucpot-e2e-hub
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://e2e:e2e@db:5432/nucpot_e2e
      - E2E_MODE=true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  resource-alpha:
    build:
      context: .
      dockerfile: apps/nfm-node-client/Dockerfile
    container_name: nucpot-e2e-resource-alpha
    environment:
      - HUB_URL=http://hub:8000
      - NODE_ID=b2000000-0000-0000-0000-000000000001
      - NODE_NAME=resource-alpha
      - NODE_TYPE=computing
    depends_on:
      hub:
        condition: service_healthy

  resource-beta:
    build:
      context: .
      dockerfile: apps/nfm-node-client/Dockerfile
    container_name: nucpot-e2e-resource-beta
    environment:
      - HUB_URL=http://hub:8000
      - NODE_ID=b2000000-0000-0000-0000-000000000002
      - NODE_NAME=resource-beta
      - NODE_TYPE=storage
    depends_on:
      hub:
        condition: service_healthy

  resource-gamma:
    build:
      context: .
      dockerfile: apps/nfm-node-client/Dockerfile
    container_name: nucpot-e2e-resource-gamma
    environment:
      - HUB_URL=http://hub:8000
      - NODE_ID=b2000000-0000-0000-0000-000000000003
      - NODE_NAME=resource-gamma
      - NODE_TYPE=observatory
    depends_on:
      hub:
        condition: service_healthy

  resource-delta:
    build:
      context: .
      dockerfile: apps/nfm-node-client/Dockerfile
    container_name: nucpot-e2e-resource-delta
    environment:
      - HUB_URL=http://hub:8000
      - NODE_ID=b2000000-0000-0000-0000-000000000004
      - NODE_NAME=resource-delta
      - NODE_TYPE=computing
    depends_on:
      hub:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: nucpot-e2e-db
    environment:
      - POSTGRES_USER=e2e
      - POSTGRES_PASSWORD=e2e
      - POSTGRES_DB=nucpot_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e"]
      interval: 3s
      timeout: 2s
      retries: 10
    volumes:
      - e2e_pgdata:/var/lib/postgresql/data

volumes:
  e2e_pgdata:
