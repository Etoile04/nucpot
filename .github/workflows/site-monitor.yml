name: NucPot Site Monitor

# =============================================================================
# Cadence contract (NFM-5309) — READ BEFORE TOUCHING THE SCHEDULE
# =============================================================================
# GitHub's scheduler chronically starves this repo's scheduled events
# (NFM-5226 root cause; NFM-5309 W40 census): delivered runs are ~8/day
# REGARDLESS of nominal cron frequency — the pre-NFM-5309 `*/10` entry
# (144/day nominal) delivered 7.9/day (5.5%), and the `17 */6` entry
# (4/day nominal) delivered ~0.36/day (~9%). All delivered runs succeed;
# events are dropped upstream of run creation, so a higher-frequency cron
# buys nothing. Asking for 144/day only advertises a cadence that never
# existed.
#
# This workflow is therefore the SUPPLEMENTARY detection lane, not the
# primary one:
#   - PRIMARY: on-host sentinel (NFM-5226 remediation) — `~/bin/nfm-site-monitor.sh`
#     launchd agent, 5-min cadence, ≤10-min detection contract, runs the same
#     `scripts/health_check.py` targets.
#   - THIS WORKFLOW: (a) public-edge probes from GitHub's vantage (a network
#     position the host sentinel cannot cover), (b) GitHub-issue alerting
#     (issues:write), (c) the 6h stale-container/container-sanity pass
#     (NFM-3337 AC-3, NFM-5269/5270) on the self-hosted runner.
#
# Expect ~8 delivered events/day here under chronic starvation; do NOT file
# "monitor is down" on cadence alone — under-firing is detected by
# scripts/site_monitor_cadence_check.py (host-side, outside GitHub Actions,
# per scripts/cron/site-monitor-cadence.cron) which pages WARN <4 runs/24h
# and CRITICAL on silence >18h or zero runs/24h.
#
# Cron offset: :23 avoids the start-of-hour slot GitHub documents as its
# highest-load drop window. The `17 */6` entry MUST keep its exact literal —
# the watchdog job's `if:` gates on `github.event.schedule == '17 */6 * * *'`.
# =============================================================================

on:
  schedule:
    # Hourly public-edge probe (honest since NFM-5309; was */10 — see header)
    - cron: '23 * * * *'
    # Stale-container watchdog (NFM-3337) — every 6h, offset 17min.
    # LITERAL IS LOAD-BEARING: watchdog job's `if:` string-matches this.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run health checks
        id: health
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: python scripts/health_check.py
        continue-on-error: true

      - name: Create issue on failure
        if: failure() && steps.health.outputs.p0_failures > 0
        uses: actions/github-script@v9
        with:
          script: |
            const failed = `${{ steps.health.outputs.failed_checks }}`;
            const total = `${{ steps.health.outputs.total_checks }}`;
            const now = new Date().toISOString();

            // Check if there's an open monitoring issue already
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['monitoring-alert', 'P0'],
              state: 'open',
            });

            if (issues.data.length > 0) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `⚠️ **Still failing** at ${now}\n${failed}/${total} checks failed.`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 NucPot Site Down — ${now.slice(0, 19)}`,
                body: `## NucPot Monitoring Alert\n\n` +
                  `**Time**: ${now}\n` +
                  `**Failed**: ${failed}/${total} checks\n` +
                  `**Severity**: P0 Critical\n\n` +
                  `### Action Required\n` +
                  `1. Check ThinkStation: \`ssh z203@100.70.30.21\`\n` +
                  `   - \`docker ps --filter name=nucpot\`\n` +
                  `   - \`systemctl status cloudflared\`\n` +
                  `2. Check Cloudflare Dashboard for tunnel status\n` +
                  `3. Check Vercel Dashboard for frontend status\n`,
                labels: ['monitoring-alert', 'P0'],
              });
            }

      - name: Health check summary
        if: always()
        run: |
          echo "## Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Total checks: ${{ steps.health.outputs.total_checks || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Failed: ${{ steps.health.outputs.failed_checks || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- P0 failures: ${{ steps.health.outputs.p0_failures || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- All passed: ${{ steps.health.outputs.all_passed || 'unknown' }}" >> $GITHUB_STEP_SUMMARY

  # ----------------------------------------------------------------
  # Stale-container watchdog (NFM-3337 / NFM-3320 AC-3)
  # Runs on the Mac Studio self-hosted runner where Docker is available.
  # ----------------------------------------------------------------
  watchdog:
    if: github.event.schedule == '17 */6 * * *'
    runs-on: [self-hosted, production]
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run stale-container watchdog
        id: watchdog
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: bash tools/post-deploy-cutover-watchdog/watchdog.sh

      # NFM-5269/NFM-5270: restart loops + empty bind sources. Read-only
      # docker/host checks; exits 81 to fail this job when a violation is
      # detected, on top of the Feishu alert. Independent of watchdog.sh,
      # so it runs even when the stale-image check failed first.
      - name: Run container sanity check (restart loops + bind sources)
        if: always()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: bash tools/post-deploy-cutover-watchdog/container_sanity_check.sh
