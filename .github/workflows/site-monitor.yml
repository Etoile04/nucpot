name: NucPot Site Monitor

# =============================================================================
# Cadence contract (NFM-5309) — READ BEFORE TOUCHING THE SCHEDULE
# =============================================================================
# GitHub's scheduler chronically starves this repo's scheduled events
# (NFM-5226 root cause; NFM-5309 W40 census): delivered runs are ~8/day
# REGARDLESS of nominal cron frequency — the pre-NFM-5309 `*/10` entry
# (144/day nominal) delivered 7.9/day (5.5%), and the `17 */6` entry
# (4/day nominal) delivered ~0.36/day (~9%). All delivered runs succeed;
# events are dropped upstream of run creation, so a higher-frequency cron
# buys nothing. Asking for 144/day only advertises a cadence that never
# existed.
#
# This workflow is therefore the SUPPLEMENTARY detection lane, not the
# primary one:
#   - PRIMARY: on-host sentinel (NFM-5226 remediation) — `~/bin/nfm-site-monitor.sh`
#     launchd agent, 5-min cadence, ≤10-min detection contract, runs the same
#     `scripts/health_check.py` targets.
#   - THIS WORKFLOW: (a) public-edge probes from GitHub's vantage (a network
#     position the host sentinel cannot cover), (b) GitHub-issue alerting
#     (issues:write), (c) an hourly runs-API staleness eye over the
#     watchdog executor (NFM-5798 P2 Leg A — the 6h stale-container/
#     container-sanity pass itself moved to the hosted orchestrator +
#     checkout-free executor split; see §9 of
#     docs/runbooks/site-monitoring.md).
#
# Expect ~8 delivered events/day here under chronic starvation; do NOT file
# "monitor is down" on cadence alone — under-firing is detected by
# scripts/site_monitor_cadence_check.py (host-side, outside GitHub Actions,
# per scripts/cron/site-monitor-cadence.cron) which pages WARN <4 runs/24h
# and CRITICAL on silence >18h or zero runs/24h.
#
# Cron offset: :23 avoids the start-of-hour slot GitHub documents as its
# highest-load drop window. (The 6h `17 */6` watchdog entry moved to
# site-monitor-watchdog-orchestrator.yml in NFM-5798 P2 Leg A; the old
# literal-cron `if:` guard class died with that split — the executor is
# dispatch-only, so there is no literal pair left to keep in sync.)
# =============================================================================

on:
  schedule:
    # Hourly public-edge probe (honest since NFM-5309; was */10 — see header)
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Job-level grant: the alert steps need issues:write (workflow-level
      # default), and the executor staleness eye needs actions:read to
      # query the runs API (NFM-5798 P2 — no write channel; the run record
      # is the heartbeat).
      issues: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run health checks
        id: health
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: python scripts/health_check.py
        continue-on-error: true

      - name: Create issue on failure
        if: failure() && steps.health.outputs.p0_failures > 0
        uses: actions/github-script@v9
        with:
          script: |
            const failed = `${{ steps.health.outputs.failed_checks }}`;
            const total = `${{ steps.health.outputs.total_checks }}`;
            const now = new Date().toISOString();

            // Check if there's an open monitoring issue already
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['monitoring-alert', 'P0'],
              state: 'open',
            });

            if (issues.data.length > 0) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `⚠️ **Still failing** at ${now}\n${failed}/${total} checks failed.`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 NucPot Site Down — ${now.slice(0, 19)}`,
                body: `## NucPot Monitoring Alert\n\n` +
                  `**Time**: ${now}\n` +
                  `**Failed**: ${failed}/${total} checks\n` +
                  `**Severity**: P0 Critical\n\n` +
                  `### Action Required\n` +
                  `1. Check ThinkStation: \`ssh z203@100.70.30.21\`\n` +
                  `   - \`docker ps --filter name=nucpot\`\n` +
                  `   - \`systemctl status cloudflared\`\n` +
                  `2. Check Cloudflare Dashboard for tunnel status\n` +
                  `3. Check Vercel Dashboard for frontend status\n`,
                labels: ['monitoring-alert', 'P0'],
              });
            }

      - name: Watchdog executor staleness check
        id: exec_stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # NFM-5798 P2: the self-hosted watchdog executor's run record IS
          # its heartbeat (no write channel — review 8fecf232 pt 2). Alert
          # when no successful executor run in over 2x the 6h nominal
          # cadence; observed fire gaps have run to ~9h under GitHub's
          # schedule starvation (NFM-5309), so 12h keeps headroom without
          # sleeping through a dead lane.
          stale_secs="${NFMD_WATCHDOG_STALE_SECS:-43200}"
          wf="site-monitor-watchdog-executor.yml"
          fetch_created() {
            gh api "repos/${{ github.repository }}/actions/workflows/$wf" --jq .created_at
          }
          created="$(fetch_created || fetch_created)" || {
            echo "::error::cannot resolve the watchdog executor workflow via the Actions API"
            exit 1
          }
          last_success="$(gh api "repos/${{ github.repository }}/actions/workflows/$wf/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty')" || {
            echo "::error::cannot query watchdog executor runs via the Actions API"
            exit 1
          }
          baseline="${last_success:-$created}"
          now="$(date -u +%s)"
          base_epoch="$(python3 -c 'import sys, datetime; print(int(datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")).timestamp()))' "$baseline")"
          age=$((now - base_epoch))
          echo "watchdog executor baseline=${baseline} age=${age}s (stale threshold ${stale_secs}s)"
          if [ "$age" -gt "$stale_secs" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "age_hours=$((age / 3600))" >> "$GITHUB_OUTPUT"
            echo "::error::watchdog executor stale: no successful run in ${age}s (> ${stale_secs}s)"
          fi

      - name: Create issue on stale watchdog executor
        if: steps.exec_stale.outputs.stale == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const ageHours = `${{ steps.exec_stale.outputs.age_hours }}`;
            const now = new Date().toISOString();
            const labels = ['monitoring-alert', 'watchdog-stale'];
            const body =
              `**[NFM-5798 P2] Watchdog executor staleness alert**\n\n` +
              `The self-hosted watchdog executor ` +
              `(\`site-monitor-watchdog-executor.yml\`) has had **no successful run in ~${ageHours}h** ` +
              `(threshold: 12h = 2x its 6h nominal cadence; the run record is its heartbeat).\n\n` +
              `Detected at ${now}.\n\n` +
              `### Action Required\n` +
              `1. Check the hosted orchestrator's recent runs ` +
              `(\`site-monitor-watchdog-orchestrator.yml\`) — is it firing at all under schedule starvation?\n` +
              `2. Check the self-hosted runner (wenjiedeMac-Studio) dispatch pickup — ` +
              `queued executor runs mean the runner is not taking \`nfmd-watchdog-exec\` dispatches.\n` +
              `3. Escalate to the NFM-5798 lane if the runner is wedged.`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels,
              state: 'open',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `⚠️ **Still stale** at ${now} — no successful executor run in ~${ageHours}h.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🟠 NucPot watchdog executor stale — no successful run in ~${ageHours}h`,
                body,
                labels,
              });
            }

      - name: Health check summary
        if: always()
        run: |
          echo "## Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Total checks: ${{ steps.health.outputs.total_checks || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Failed: ${{ steps.health.outputs.failed_checks || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- P0 failures: ${{ steps.health.outputs.p0_failures || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- All passed: ${{ steps.health.outputs.all_passed || 'unknown' }}" >> $GITHUB_STEP_SUMMARY
