name: Extraction Parity

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily

# Prevent parallel runs on the same PR — only keep the latest.
concurrency:
  group: extraction-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # Needed for PR comment

jobs:
  extraction-parity:
    name: extraction-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # NFM-2891 / NFM-2998-T2: Run V2 extraction parity tests against
      # curated baseline fixtures. EXTRACTION_STUB_MODE=true activates
      # deterministic stub responses so tests don't need LLM API keys.
      - name: Run parity tests
        id: parity
        run: |
          uv run pytest tests/parity/ -m parity -v \
            --tb=short \
            --junitxml=parity-report.xml \
            --override-ini="addopts="
        env:
          EXTRACTION_STUB_MODE: "true"
        working-directory: ${{ github.workspace }}

      # Upload the raw JUnit XML as a downloadable artifact.
      - name: Upload parity report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-report
          # The `parity` step above overrides the default `working-directory:
          # apps/api` to ${{ github.workspace }}, so --junitxml writes
          # parity-report.xml at the REPO ROOT, not under apps/api/.
          path: parity-report.xml
          retention-days: 30

      # Convert JUnit XML to a JSON summary for machine-readable artifact.
      - name: Generate JSON summary
        if: always()
        id: summary
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, json, sys

          tree = ET.parse('parity-report.xml')
          root = tree.getroot()

          testsuites = root if root.tag == 'testsuites' else root
          total = 0
          passed = 0
          failed = 0
          skipped = 0
          failures = []

          for ts in testsuites.findall('.//testsuite'):
            for tc in ts.findall('testcase'):
              total += 1
              status = 'passed'
              for child in tc:
                if child.tag == 'failure':
                  status = 'failed'
                  failures.append({
                    'name': tc.get('name', ''),
                    'classname': tc.get('classname', ''),
                    'message': child.get('message', '')[:200],
                  })
                elif child.tag == 'skipped':
                  status = 'skipped'
              if status == 'passed':
                passed += 1
              elif status == 'failed':
                failed += 1
              else:
                skipped += 1

          result = {
            'total': total,
            'passed': passed,
            'failed': failed,
            'skipped': skipped,
            'failures': failures,
          }
          with open('parity-summary.json', 'w') as f:
            json.dump(result, f, indent=2)
          print(json.dumps(result))
          " 2>&1 | tee /dev/stderr
        working-directory: ${{ github.workspace }}

      - name: Upload JSON summary artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-summary
          path: parity-summary.json
          retention-days: 30

      # Post a pass/fail summary as a PR comment (skip on schedule runs).
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(
              fs.readFileSync('${{ github.workspace }}/parity-summary.json', 'utf8')
            );

            const status = summary.failed === 0 ? '✅ PASSED' : '❌ FAILED';
            const body = [
              `## Extraction Parity ${status}`,
              '',
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Total  | ${summary.total} |`,
              `| Passed | ${summary.passed} |`,
              `| Failed | ${summary.failed} |`,
              `| Skipped| ${summary.skipped} |`,
            ];

            if (summary.failures.length > 0) {
              body.push('');
              body.push('### Failures');
              for (const f of summary.failures) {
                body.push(`- **${f.name}**: ${f.message}`);
              }
            }

            body.push('');
            body.push(`[📄 Download full report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.join('\n'),
            });
