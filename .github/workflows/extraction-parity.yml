name: extraction-parity

"on":
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pull-requests: write

jobs:
  extraction-parity:
    name: Extraction V1-V2 Parity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run parity tests
        id: parity
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail

          REPORT_JSON="${{ github.workspace }}/parity-report.json"
          OUTPUT_TXT="${{ github.workspace }}/parity-output.txt"

          write_report() {
            python3 - "$1" "$2" "$3" "$REPORT_JSON" <<'PYEOF'
          import json, sys
          passed, failed, exit_code, path = sys.argv[1:5]
          report = {
              'total': int(passed) + int(failed),
              'passed': int(passed),
              'failed': int(failed),
              'exit_code': int(exit_code),
          }
          with open(path, 'w') as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          PYEOF
          }

          # Guard: skip if tests/parity/ doesn't exist yet (parity test
          # fixtures are shipped by a sibling PR). Produce a stub report so
          # downstream annotation/upload steps don't crash on ENOENT.
          if [ ! -d "${{ github.workspace }}/tests/parity" ]; then
            echo "::notice title=Parity tests skipped::tests/parity/ directory not found — parity test fixtures have not been merged yet."
            echo "pytest_exit=0" >> "$GITHUB_OUTPUT"
            python3 -c "
            import json
            report = {'total': 0, 'passed': 0, 'failed': 0, 'exit_code': 0, 'skipped': True}
            with open('$REPORT_JSON', 'w') as f:
              json.dump(report, f, indent=2)
            "
            echo "SKIPPED" > "$OUTPUT_TXT"
            exit 0
          fi

          # Run from repo root (absolute path — NOT the job-level
          # working-directory apps/api) so root pyproject.toml registers
          # the `parity` marker and discovers tests/parity/, and
          # tests/parity/conftest.py bootstraps apps/api/src onto sys.path.
          # EXTRACTION_STUB_MODE=true activates the stub pipeline path.
          # NOTE: no `set -e` here — a pytest failure must still produce
          # parity-report.json so the artifact upload and PR comment steps
          # don't crash on ENOENT; the step's exit code is set explicitly
          # at the end.
          set +e
          uv run --project apps/api python -m pytest \
            -m parity \
            "${{ github.workspace }}/tests/parity/" \
            -v \
            --no-header \
            --tb=short \
            -o "addopts=" \
            2>&1 | tee "$OUTPUT_TXT"
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e

          echo "pytest_exit=${PYTEST_EXIT}" >> "$GITHUB_OUTPUT"

          # Generate a compact JSON summary from pytest output
          PASS_COUNT=$(grep -cP 'tests/parity/.* PASSED' "$OUTPUT_TXT" || true)
          FAIL_COUNT=$(grep -cP 'tests/parity/.* FAILED' "$OUTPUT_TXT" || true)

          write_report "$PASS_COUNT" "$FAIL_COUNT" "$PYTEST_EXIT"

          exit "$PYTEST_EXIT"

      - name: Upload parity report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-report
          path: |
            parity-report.json
            parity-output.txt
          retention-days: 30

      - name: Post PR comment with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(
              fs.readFileSync("${{ github.workspace }}/parity-report.json", "utf8")
            );
            const exitCode = parseInt(process.env.PYTEST_EXIT || "1");

            const skipped = report.skipped === true;
            const icon = skipped ? "⏭️" : (report.failed === 0 ? "✅" : "❌");
            const body = [
              `### ${icon} Extraction Parity Tests${skipped ? ' (skipped)' : ''}`,
              "",
              skipped
                ? "> `tests/parity/` not found — parity test fixtures have not been merged yet."
                : [
                    "| Metric | Value |",
                    "|--------|-------|",
                    `| **Total** | ${report.total} |`,
                    `| **Passed** | ${report.passed} |`,
                    `| **Failed** | ${report.failed} |`,
                  ].join("\n"),
              "",
              `> Commit: \`${context.sha.slice(0, 7)}\` · ` +
              `[workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
