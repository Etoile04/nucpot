name: Extraction Parity

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily

# Prevent parallel runs on the same PR — only keep the latest.
concurrency:
  group: extraction-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # Needed for PR comment

jobs:
  extraction-parity:
    name: extraction-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # NFM-2891 / NFM-2998-T2: Run V2 extraction parity tests against
      # curated baseline fixtures. EXTRACTION_STUB_MODE=true activates
      # deterministic stub responses so tests don't need LLM API keys.
      # Tests live at repo-root tests/parity/ (outside apps/api/) but
      # import from nfm_db via conftest sys.path bootstrap, so we run
      # from the apps/api venv using a relative path (../../tests/parity/)
      # matching the pattern in test-api.yml for out-of-tree test dirs.
      - name: Run parity tests
        id: parity
        run: |
          uv run pytest ../../tests/parity/ -m parity -v \
            --tb=short \
            --junitxml=parity-report.xml \
            --override-ini="addopts="
        env:
          EXTRACTION_STUB_MODE: "true"

      # Upload the raw JUnit XML as a downloadable artifact.
      - name: Upload parity report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-report
          path: apps/api/parity-report.xml
          retention-days: 30

      # Convert JUnit XML to a JSON summary for machine-readable artifact.
      - name: Generate JSON summary
        if: always()
        id: summary
        run: |
          uv run python -c "
          import xml.etree.ElementTree as ET, json, sys

          tree = ET.parse('parity-report.xml')
          root = tree.getroot()

          testsuites = root if root.tag == 'testsuites' else root
          total = 0
          passed = 0
          failed = 0
          skipped = 0
          failures = []

          for ts in testsuites.findall('.//testsuite'):
            for tc in ts.findall('testcase'):
              total += 1
              status = 'passed'
              for child in tc:
                if child.tag == 'failure':
                  status = 'failed'
                  failures.append({
                    'name': tc.get('name', ''),
                    'classname': tc.get('classname', ''),
                    'message': child.get('message', '')[:200],
                  })
                elif child.tag == 'skipped':
                  status = 'skipped'
              if status == 'passed':
                passed += 1
              elif status == 'failed':
                failed += 1
              else:
                skipped += 1

          result = {
            'total': total,
            'passed': passed,
            'failed': failed,
            'skipped': skipped,
            'failures': failures,
          }
          with open('parity-summary.json', 'w') as f:
            json.dump(result, f, indent=2)
          print(json.dumps(result))
          " 2>&1 | tee /dev/stderr

      - name: Upload JSON summary artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-summary
          path: apps/api/parity-summary.json
          retention-days: 30

      # Post a pass/fail summary as a PR comment (skip on schedule runs).
      # Uses an HTML marker to find and update an existing comment instead
      # of creating a new one each run (idempotent annotation pattern).
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(
              fs.readFileSync('${{ github.workspace }}/apps/api/parity-summary.json', 'utf8')
            );

            const status = summary.failed === 0 ? '✅ PASSED' : '❌ FAILED';
            const body = [
              `<!-- extraction-parity-marker -->`,
              `## Extraction Parity ${status}`,
              '',
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Total  | ${summary.total} |`,
              `| Passed | ${summary.passed} |`,
              `| Failed | ${summary.failed} |`,
              `| Skipped| ${summary.skipped} |`,
            ];

            if (summary.failures.length > 0) {
              body.push('');
              body.push('### Failures');
              for (const f of summary.failures) {
                body.push(`- **${f.name}**: ${f.message}`);
              }
            }

            body.push('');
            body.push(`[📄 Download full report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`);

            const newBody = body.join('\n');

            // Search for an existing comment with our idempotent marker.
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(
              c => c.body.includes('<!-- extraction-parity-marker -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: newBody,
              });
              core.info(`Updated existing comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: newBody,
              });
              core.info('Created new parity comment');
            }
