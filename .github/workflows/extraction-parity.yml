# V1/V2 extraction parity harness — observational CI job (NFM-2923 / ADR-0007 §3).
#
# Status: OBSERVATIONAL ONLY. Does not block merges. Promotion to a required
# status check is gated on the harness running GREEN for >=7 consecutive
# days on staging (ADR-0007 §3 / NFM-2916 phased gate).
#
# Triggers: pull_request that touches apps/api/**, tests/parity/** or the
# curated baseline under tests/fixtures/parity/**.
# Runs the parity harness (tests/parity/test_parity.py, shipped by NFM-2891),
# captures the per-fixture summary to a file artifact (>=7 day retention),
# and posts a PR annotation summarising the outcome.

name: extraction-parity (observational)

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'tests/parity/**'
      # A baseline edit changes the expected output, so it must re-run the
      # harness — otherwise a bad regenerated expected.json lands unobserved.
      - 'tests/fixtures/parity/**'

permissions:
  contents: read
  pull-requests: write

# Cancel in-progress runs for the same PR — keeps CI minutes cheap when an
# author force-pushes. Does not affect merge gating (there is none).
concurrency:
  group: parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: V1/V2 extraction parity harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'apps/api/uv.lock'

      # Creates apps/api/.venv with the full API dependency set. This is the
      # same install every other backend job in this repo uses; the parity
      # harness needs it because its import chain reaches SQLAlchemy.
      - name: Install API dev dependencies
        working-directory: apps/api
        run: uv sync --extra dev --frozen

      # The parity harness lives at REPO ROOT (tests/parity/test_parity.py,
      # NFM-2891) — not under apps/api/. It must be invoked from the repo root
      # so pytest picks up the root pyproject.toml, which is the config that
      # registers the `parity` marker and, critically, does NOT carry the
      # apps/api `--cov`/`-m 'not integration'` addopts.
      #
      # Dependencies come from the apps/api venv: tests/parity/conftest.py
      # bootstraps apps/api/src onto sys.path, and the import chain
      # (nfm_db.services.__init__ -> ontology_sync) pulls in SQLAlchemy, so a
      # bare pytest install is not sufficient.
      #
      # `continue-on-error` — NOT `|| true` — is what makes this observational.
      # `|| true` would force steps.parity.outcome to 'success' and the PR
      # annotation below would report GREEN even on a real parity break,
      # manufacturing a false 7-day green streak for the NFM-2916 gate.
      # `continue-on-error` keeps the true outcome readable while letting the
      # job continue. `pipefail` stops `tee` from masking pytest's exit code.
      - name: Run parity harness (observational)
        id: parity
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p parity-artifacts
          apps/api/.venv/bin/python -m pytest \
            tests/parity/test_parity.py \
            -v --tb=short \
            2>&1 | tee parity-artifacts/parity-output.txt

      - name: Annotate run log with parity outcome
        if: always()
        run: |
          echo "::notice title=Parity harness finished::outcome=${{ steps.parity.outcome }} — see artifact 'extraction-parity-summary' for the per-fixture summary."

      - name: Upload parity summary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extraction-parity-summary
          path: parity-artifacts/parity-output.txt
          if-no-files-found: warn
          # 14 days >> AC-required 7. ADR-0007 §3 review window is one
          # week; doubling that gives the CPO headroom to inspect runs
          # without rushing to download.
          retention-days: 14

      # Posts (or updates) a single bot comment on the PR. Uses an HTML
      # comment marker so reruns replace the prior comment in place
      # instead of stacking. `if: always()` ensures we annotate even on
      # harness failure.
      - name: Annotate PR with parity status (observational)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.parity.outcome }}
        with:
          script: |
            const marker = '<!-- extraction-parity-bot -->';
            const outcome = (process.env.OUTCOME || 'unknown');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;
            const verdict = outcome === 'success' ? 'GREEN' : 'OBSERVED-FAIL';
            const emoji = outcome === 'success' ? '✅' : '⚠️';
            const body = marker + '\n' +
              '## ' + emoji + ' V1/V2 extraction parity (observational)\n\n' +
              '**Outcome:** `' + outcome + '` → **' + verdict + '**\n\n' +
              '**This job is observational only — it does NOT gate merge.** Per ADR-0007 §3 ' +
              'the harness must run GREEN for ≥7 consecutive days on staging before promotion ' +
              'to a required status check.\n\n' +
              '📥 Per-fixture summary: download the `extraction-parity-summary` artifact from ' +
              '[this run](' + runUrl + ') (14-day retention).\n\n' +
              '_Issue: NFM-2923 · Harness: NFM-2922 · Gate prep: NFM-2916_';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.data.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
