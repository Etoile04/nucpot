name: Staging Deploy

# =============================================================================
# NFM-DB — Staging deployment pipeline (NFM-111)
# =============================================================================
# Manually-triggered deploy to the staging host (ThinkStation). Pulls the
# selected ref, runs scripts/staging_deploy.sh deploy (build + migrate + up +
# health gate + auto-rollback), then scripts/staging_smoke_test.py. A failing
# health gate auto-rolls back on the host; a failing smoke test fails the run.
#
# SSH transport (NFM-1564 — runner host moved off the staging host): the GHA
# runner with labels `self-hosted` + `staging` is registered on the Mac Studio
# (`nucpot-staging-macstudio`), NOT on the ThinkStation. The three
# appleboy/ssh-action steps therefore SSH to the staging host over its
# Tailscale address (`vars.STAGING_SSH_HOST`, default 100.70.30.21) using the
# host's own OpenSSH sshd. No tunnel, bastion, or Access service token is
# involved. The deploy scripts themselves are unchanged.
#
# Why the runner moved (NFM-1564, measured 2026-11-18): the staging host's
# egress could not sustain job dispatch. `vstoken.actions.githubusercontent.com`
# POST success from that host was 2-3/10 (curl AND openssl stacks alike, so
# not a TLS-fingerprint issue and not a long-connection reset), while the same
# POST from the Mac Studio was 10/10. Consequence: OAuth token refresh kept
# failing → broker session expired (`TaskAgentSessionExpiredException`) → the
# job assignment was invalidated (`job assignment is invalid`) → the queued job
# was cancelled by GitHub after ~6 min with `runner=NONE`. The ADR-024
# terminating proxy was NOT the fix: it targets ClientHello-fingerprint DPI,
# which the measurement above rules out here.
#
# Historical transport (NFM-150 rev 2 — self-hosted runner ON the ThinkStation):
# the runner used to be registered on the ThinkStation itself, so the steps
# SSHed over loopback (127.0.0.1:22). Full architecture + security review:
# NFM-150 spec. The loopback assumption is what NFM-1564 removes.
#
# REQUIRED GitHub secrets (create before first run — see NFM-112 / NFM-150):
#   STAGING_SSH_USER  SSH user with docker access on the host
#   STAGING_SSH_KEY   private key for the SSH user (PEM)
#   GHCR_TOKEN        GitHub Container Registry token (if using GHCR images)
#
# SSH host (NFM-1564): the target is no longer hardcoded to loopback. It is
# read from the `staging` environment VARIABLE `STAGING_SSH_HOST` (the
# staging host's Tailscale address; default 100.70.30.21 if the variable is
# unset). The runner lives on the Mac Studio, so the steps SSH across the
# Tailscale tailnet instead of over loopback. The TUNNEL_SERVICE_TOKEN_*
# secrets are obsolete and can be deleted.
#
# Prerequisite: the host must expose an OpenSSH sshd on :22 that accepts
# STAGING_SSH_KEY for STAGING_SSH_USER (set up in NFM-112), and the host
# must be reachable from the runner host at the configured address (today:
# Tailscale, direct connection).
#
# Runs in the `staging` environment (Actions → Environments → New "staging").
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: false
        default: "main"
      image_tag:
        description: "Image tag for nucpot-staging-{api,web} (enables rollback)"
        required: false
        default: "latest"
      skip_smoke:
        description: "Skip the post-deploy smoke test"
        required: false
        type: boolean
        default: false

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    runs-on: [self-hosted, staging]
    environment: staging
    # ADR-018 / NFM-4762: staging CI egress = direct. The 7897 bridge
    # proxy was retired (empty Clash Verge ruleset, no subscription —
    # a pure DIRECT alias adding 12s to pypi). The drone-ssh download
    # below goes through the DIRECT-reachable gh-proxy.com mirror so the
    # GFW `curl: (35)` reset on raw github.com is sidestepped without
    # needing a proxy env.
    #
    # STAGING_REPO_DIR (NFM-157 fix 2, option A): the host checkout lives at
    # /home/z203/nucpot-staging/repo, not the script default
    # /opt/nucpot-staging/repo (which does not exist on the host). Job env does
    # NOT cross the SSH boundary by itself, so each appleboy step lists
    # STAGING_REPO_DIR in its `envs:` to forward it to the remote, where the
    # scripts' `REPO_DIR="${STAGING_REPO_DIR:-...}"` resolves it. Only
    # STAGING_REPO_DIR is forwarded — proxy vars are not needed remotely.
    env:
      STAGING_REPO_DIR: /home/z203/nucpot-staging/repo
      # NFM-162: fetch drone-ssh from a DIRECT-reachable GitHub-release mirror
      # instead of raw github.com release assets. The box's JMS circumvention
      # nodes are all dead (mihomo delay-test times out → Proxies→US collapses
      # to DIRECT), so HTTP(S)_PROXY is effectively a no-op and appleboy's
      # `curl -fsSL --retry 5` hits the intermittent GFW `curl: (35)` TLS reset
      # on github.com (curl does NOT retry TLS errors). gh-proxy.com serves the
      # exact official v1.8.0 linux-amd64 ELF (sha 5c37ea6f…, matches appleboy
      # checksums.txt; cross-checked byte-identical against ghproxy.net) and is
      # DIRECT-reachable, sidestepping the reset. job-env + step `envs:` ONLY —
      # no step-level `env:` override, which would shadow this and silently
      # re-break the download (the NFM-161 local-cache approach is retired: it
      # needed host prep at `/home/z203/drone-ssh-cache` and "no host change" is
      # an NFM-162 constraint). Backup mirror if gh-proxy.com is ever down:
      # https://ghproxy.net/https://github.com/appleboy/drone-ssh/releases/download
      DRONE_SSH_RELEASE_URL: https://gh-proxy.com/https://github.com/appleboy/drone-ssh/releases/download
    # NFM-1564: the step-level command_timeout (45m) must stay below the job
    # backstop so a stuck deploy fails the STEP (clean signal) rather than the
    # whole job (which shows up as a cancelled run).
    timeout-minutes: 55
    steps:
      - name: Configure SSH + deploy on staging host
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.STAGING_SSH_HOST || '100.70.30.21' }}
          port: 22
          # NFM-1564: the default 10m command_timeout is too short once the
          # deploy runs cross-host — the compose build re-pulls the GHCR base
          # image layers and rebuilds the web bundle (the loopback era hit a
          # fully cached build and finished well inside 10m). Measured: the
          # 2026-11-18 run was cut at exactly 10m while still pulling layers.
          command_timeout: 45m
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: STAGING_REPO_DIR,DRONE_SSH_RELEASE_URL
          script_stop: true
          script: |
            set -euo pipefail
            REPO_DIR="${STAGING_REPO_DIR:-/opt/nucpot-staging/repo}"
            REF="${{ inputs.ref }}"
            TAG="${{ inputs.image_tag }}"

            echo "===> NFM-DB staging deploy: ref=$REF tag=$TAG"
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "ERROR: $REPO_DIR is not a git checkout. Run one-time host prep first (NFM-112)." >&2
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch --all --prune
            git checkout "$REF"
            git reset --hard "$(git rev-parse "origin/$REF" 2>/dev/null || echo "$REF")"

            if [ ! -f docker/.env.staging ]; then
              echo "ERROR: docker/.env.staging missing on host. Run one-time host prep (NFM-112)." >&2
              exit 1
            fi

            # NFM-2509: pre-deploy guard against the staging cloudflared container
            # being pointed at the production tunnel token. Decodes the JWT in
            # STAGING_CLOUDFLARE_TUNNEL_TOKEN and refuses the deploy if the
            # embedded tunnel id matches the prod denylist. Non-zero exit
            # aborts the SSH `set -e` and the whole job.
            ./scripts/verify-cloudflared-token.sh docker/.env.staging

            export STAGING_IMAGE_TAG="$TAG"
            ./scripts/staging_deploy.sh deploy

      - name: Run staging smoke test
        if: ${{ inputs.skip_smoke != true }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.STAGING_SSH_HOST || '100.70.30.21' }}
          port: 22
          # NFM-1564: the default 10m command_timeout is too short once the
          # deploy runs cross-host — the compose build re-pulls the GHCR base
          # image layers and rebuilds the web bundle (the loopback era hit a
          # fully cached build and finished well inside 10m). Measured: the
          # 2026-11-18 run was cut at exactly 10m while still pulling layers.
          command_timeout: 45m
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: STAGING_REPO_DIR,DRONE_SSH_RELEASE_URL
          script_stop: true
          script: |
            set -euo pipefail
            REPO_DIR="${STAGING_REPO_DIR:-/opt/nucpot-staging/repo}"
            cd "$REPO_DIR"
            python3 scripts/staging_smoke_test.py

      - name: Report status
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.STAGING_SSH_HOST || '100.70.30.21' }}
          port: 22
          # NFM-1564: the default 10m command_timeout is too short once the
          # deploy runs cross-host — the compose build re-pulls the GHCR base
          # image layers and rebuilds the web bundle (the loopback era hit a
          # fully cached build and finished well inside 10m). Measured: the
          # 2026-11-18 run was cut at exactly 10m while still pulling layers.
          command_timeout: 45m
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: STAGING_REPO_DIR,DRONE_SSH_RELEASE_URL
          script_stop: false
          script: |
            set -euo pipefail || true
            REPO_DIR="${STAGING_REPO_DIR:-/opt/nucpot-staging/repo}"
            cd "$REPO_DIR"
            ./scripts/staging_deploy.sh status || true
