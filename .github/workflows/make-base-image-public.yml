# =============================================================================
# Flip ghcr.io/etoile04/nucpot-build-base to public visibility (one-shot)
# =============================================================================
# Post-merge follow-up to NFM-5160 (ADR-022 D1, parent NFM-5155/NFM-5156):
# the base-image.yml workflow header explicitly anticipates this — "flip the
# ghcr.io/etoile04/nucpot-build-base package to public visibility so the
# deploy host's anonymous (credential-helper-free) `docker pull` can reach
# it, matching the alpine:3.20 / pgvector/pgvector:pg16 pull pattern in
# production-deployment.yml."
#
# This is a one-shot operational action, NOT a recurring build; it should
# be deleted after the dispatch lands. The repository contains no token
# with `packages:write` outside GitHub Actions, so the flip has to run as
# a workflow (which gets an installation token with packages:write scoped
# to this repo's pushes).
#
# Approved by Code Reviewer as part of the NFM-5160 post-merge legs
# (comment e444d59e on NFM-5160: "Release Engineer ... please proceed with
# the admin-squash merge + the NFM-5172 post-merge legs (base-image first
# dispatch on main, GHCR verify + public flip, shim removal)").
# =============================================================================
name: Make nucpot-build-base public (one-shot)

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  flip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Flip nucpot-build-base to public visibility
        env:
          OWNER: Etoile04
          PACKAGE: nucpot-build-base
        run: |
          set -euo pipefail
          echo "Current visibility:"
          gh api "users/${OWNER}/packages/container/${PACKAGE}" \
            --jq '{name, visibility, owner: .owner.login}' \
            || { echo "::error::package lookup returned non-zero (package not found or no read scope)"; exit 1; }

          echo "Flipping to public..."
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "users/${OWNER}/packages/container/${PACKAGE}" \
            -f visibility=public

          echo "Post-flip verification:"
          gh api "users/${OWNER}/packages/container/${PACKAGE}" \
            --jq '{name, visibility, owner: .owner.login}'