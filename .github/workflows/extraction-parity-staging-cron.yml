# Nightly staging parity cron — ADR-0007 §3 / NFM-2944.
#
# Runs the V1/V2 extraction parity harness (apps/api/tests/test_parity.py)
# against staging (origin/main) every night at 02:00 UTC, producing
# per-fixture artifacts for the 7-day green-streak gate.
#
# Requires EXTRACTION_STUB_MODE=true and -m parity marker to actually
# execute tests (see test_parity.py module guard).
#
# OBSERVATIONAL ONLY — does not gate merges. Uses continue-on-error (not
# || true) so the real outcome is preserved for the streak counter.

name: extraction-parity-staging-cron

on:
  schedule:
    - cron: "0 2 * * *"   # Every night at 02:00 UTC
  workflow_dispatch:         # Manual trigger for ad-hoc runs

permissions:
  contents: read

jobs:
  parity:
    name: V1/V2 extraction parity (nightly staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install API dev dependencies
        working-directory: apps/api
        run: uv sync --extra dev --frozen

      - name: Run parity harness (observational)
        id: parity
        continue-on-error: true
        env:
          EXTRACTION_STUB_MODE: "true"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p parity-artifacts
          uv run --frozen --directory apps/api python -m pytest \
            tests/test_parity.py \
            -m parity \
            --no-cov \
            -v --tb=short \
            2>&1 | tee parity-artifacts/parity-output.txt

      - name: Upload parity summary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extraction-parity-staging-summary
          path: parity-artifacts/parity-output.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Write streak artifact (gate-check fallback)
        if: always()
        run: |
          set -euo pipefail
          # T1 maintains the streak counter in parity-streak-data/streak.txt (cached).
          # This step copies the current streak value to an artifact that the
          # parity-gate-check reusable workflow uses as a fallback when cache
          # is evicted. Artifact retention is 90 days vs cache's 7-day default.
          STREAK_FILE="parity-streak-data/streak.txt"
          mkdir -p parity-artifacts
          if [ -f "${STREAK_FILE}" ]; then
            cp "${STREAK_FILE}" parity-artifacts/streak.txt
            echo "Streak artifact written from cache file: $(cat "${STREAK_FILE}")"
          else
            # T1 streak counter not yet present — write 0 so the gate-check
            # artifact path has a valid (failing) value rather than 404.
            echo "0" > parity-artifacts/streak.txt
            echo "No streak cache file found — wrote default 0"
          fi
        shell: bash

      - name: Upload streak value artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-streak-value
          path: parity-artifacts/streak.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Step summary
        if: always()
        run: |
          echo "## Nightly Staging Parity Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Outcome:** ${{ steps.parity.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** Download \`extraction-parity-staging-summary\` from the run page (30-day retention)" >> $GITHUB_STEP_SUMMARY

      - name: Send Feishu alert on failure
        if: failure() && steps.parity.outcome == 'failure'
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            curl -s -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{
                \"msg_type\": \"interactive\",
                \"card\": {
                  \"header\": {
                    \"title\": { \"tag\": \"plain_text\", \"content\": \"Nightly Staging Parity Failed\" },
                    \"template\": \"red\"
                  },
                  \"elements\": [{
                    \"tag\": \"markdown\",
                    \"content\": \"**V1/V2 extraction parity harness failed on staging**\\nTime: ${TIMESTAMP}\\nOutcome: \`${{ steps.parity.outcome }}\`\\n[View Run](${RUN_URL})\"
                  }]
                }
              }"
          fi
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK }}
