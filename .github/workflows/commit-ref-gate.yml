name: Commit Reference Gate

# Per ADR-NFM-2081 §D1: CI is the gate. The local commit-msg hook
# (.githooks/commit-msg, NFM-2084) is fast-feedback convenience only.
# This workflow is the authoritative enforcement — it survives a fresh
# clone with no local git config, so `--no-verify` and skipped hooks
# cannot bypass the rule.
#
# Rule (must stay in lock-step with scripts/okr/commit_efficiency.py:31
# — `re.compile(r"NFM-\d+")`, and the local hook at .githooks/commit-msg):
#   PASS for a non-merge commit subject when EITHER:
#     1. the subject matches /NFM-[0-9]+/           (NFM-### reference)
#     2. the subject contains the literal "[no-issue]" (auditable escape hatch)
#     3. the subject starts with 'Revert "'            (auto-generated by git revert)
#   Merge commits (parent-count >= 2) are exempt by construction.

on:
  pull_request:
    branches: [main]
  # NFM-2191 AC-2: while the gate was PR-only, a direct push to main bypassed
  # it entirely. Validating on push closes that hole, and also covers
  # squash-merge subjects — those are authored at merge time and therefore
  # never seen by the pull_request run.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-commit-subjects:
    name: Validate every non-merge commit subject in PR range
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation target with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR base ref
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          # Fetch the base ref with full history so merge-base can resolve
          # the fork point even when the PR head is behind main (NFM-2256).
          git fetch --no-tags origin "${BASE_REF}"

      # Both "Resolve commit range" steps below export the same two variables
      # — RANGE_START (exclusive lower bound, empty means "no lower bound")
      # and RANGE_END (inclusive upper bound) — so the validation step that
      # follows carries the rule exactly once, for both event kinds.
      - name: Resolve commit range (pull_request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Resolve the actual PR range via merge-base. This handles the
          # case where `origin/${BASE_REF}` has advanced since the PR was
          # opened (the head.sha base snapshot may then be stale); using
          # merge-base pins the range to the real fork point of this PR.
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          MERGE_BASE="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"

          echo "PR base ref:       ${BASE_REF}"
          echo "Resolved base SHA: ${BASE_SHA}"
          echo "Merge-base:        ${MERGE_BASE}"
          echo "PR head SHA:       ${HEAD_SHA}"

          {
            echo "RANGE_START=${MERGE_BASE}"
            echo "RANGE_END=${HEAD_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Resolve commit range (push)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # A direct push has no merge-base to resolve: the range is simply
          # what the push moved main from → to. `before` is the all-zeros
          # sentinel on a branch's first push, and is also unreachable after
          # a force-push that discarded it — in both cases fall back to the
          # parent of `after`. If `after` is a root commit with no parent,
          # drop the lower bound and validate its full reachable history.
          ZERO="0000000000000000000000000000000000000000"

          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "${ZERO}" ]] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            RANGE_START="${BEFORE_SHA}"
          elif RANGE_START="$(git rev-parse --verify --quiet "${AFTER_SHA}^")"; then
            echo "'before' unusable (${BEFORE_SHA:-<empty>}) — fell back to ${AFTER_SHA}^"
          else
            RANGE_START=""
            echo "'after' is a root commit — validating full reachable history."
          fi

          echo "Push before SHA:   ${BEFORE_SHA:-<empty>}"
          echo "Range lower bound: ${RANGE_START:-<root>}"
          echo "Push after SHA:    ${AFTER_SHA}"

          {
            echo "RANGE_START=${RANGE_START}"
            echo "RANGE_END=${AFTER_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Validate commit subjects
        run: |
          set -euo pipefail

          MERGE_BASE="${RANGE_START:-}"
          HEAD_SHA="${RANGE_END:?commit range was never resolved}"

          if [[ "${MERGE_BASE}" == "${HEAD_SHA}" ]]; then
            echo "HEAD equals merge-base — no new commits in range. Nothing to validate."
            exit 0
          fi

          # With no lower bound (root-commit push) walk everything reachable
          # from HEAD; otherwise walk the half-open range.
          if [[ -n "${MERGE_BASE}" ]]; then
            REV_RANGE="${MERGE_BASE}..${HEAD_SHA}"
          else
            REV_RANGE="${HEAD_SHA}"
          fi

          # Enumerate non-merge commits in the PR range, oldest → newest.
          # --no-merges drops merge commits (parent-count >= 2); the issue
          # defines merges as exempt by construction. Format with an
          # explicit tab separator (`%x09`) so subject text containing
          # spaces or colons parses cleanly.
          FAIL=0
          FAIL_REPORT=""
          COUNT=0

          while IFS=$'\t' read -r sha subject; do
            [[ -z "${sha}" ]] && continue
            COUNT=$((COUNT + 1))

            if [[ "${subject}" =~ NFM-[0-9]+ ]]; then
              printf 'OK   %s  %s\n' "${sha}" "${subject}"
              continue
            fi

            if [[ "${subject}" == *"[no-issue]"* ]]; then
              printf 'OK   %s  %s  [no-issue]\n' "${sha}" "${subject}"
              continue
            fi

            if [[ "${subject}" == 'Revert "'* ]]; then
              printf 'OK   %s  %s  [Revert]\n' "${sha}" "${subject}"
              continue
            fi

            FAIL=1
            FAIL_REPORT+="FAIL ${sha}  ${subject}"$'\n'
          done < <(git log --format='%H%x09%s' --no-merges --reverse "${REV_RANGE}")

          if [[ "${COUNT}" -eq 0 ]]; then
            echo "All commits in the range are merge commits — nothing to validate."
            exit 0
          fi

          if [[ "${FAIL}" -eq 1 ]]; then
            {
              echo ""
              echo "::error title=Commit subject gate::Commit subject gate FAILED — every non-merge commit subject must reference NFM-###, contain the literal '[no-issue]' token, or start with 'Revert \"'."
              echo ""
              echo "Failing commits:"
              echo "${FAIL_REPORT}"
            } >&2
            exit 1
          fi

          echo ""
          echo "All ${COUNT} non-merge commits in PR pass the gate."
