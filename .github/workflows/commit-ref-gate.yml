name: Commit Reference Gate

# Per ADR-NFM-2081 §D1: CI is the gate. The local commit-msg hook
# (.githooks/commit-msg, NFM-2084) is fast-feedback convenience only.
# This workflow is the authoritative enforcement — it survives a fresh
# clone with no local git config, so `--no-verify` and skipped hooks
# cannot bypass the rule.
#
# Rule (must stay in lock-step with scripts/okr/commit_efficiency.py:31
# — `re.compile(r"NFM-\d+")`, and the local hook at .githooks/commit-msg):
#   PASS for a non-merge commit subject when EITHER:
#     1. the subject matches /NFM-[0-9]+/           (NFM-### reference)
#     2. the subject contains the literal "[no-issue]" (auditable escape hatch)
#     3. the subject starts with 'Revert "'            (auto-generated by git revert)
#   Merge commits (parent-count >= 2) are exempt by construction.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-commit-subjects:
    name: Validate every non-merge commit subject in PR range
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR base ref
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --depth=1 origin "${BASE_REF}"

      - name: Validate commit subjects
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Resolve the actual PR range via merge-base. This handles the
          # case where `origin/${BASE_REF}` has advanced since the PR was
          # opened (the head.sha base snapshot may then be stale); using
          # merge-base pins the range to the real fork point of this PR.
          BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
          MERGE_BASE="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"

          echo "PR base ref:       ${BASE_REF}"
          echo "Resolved base SHA: ${BASE_SHA}"
          echo "Merge-base:        ${MERGE_BASE}"
          echo "PR head SHA:       ${HEAD_SHA}"

          if [[ "${MERGE_BASE}" == "${HEAD_SHA}" ]]; then
            echo "HEAD equals merge-base — no new commits in PR range. Nothing to validate."
            exit 0
          fi

          # Enumerate non-merge commits in the PR range, oldest → newest.
          # --no-merges drops merge commits (parent-count >= 2); the issue
          # defines merges as exempt by construction. Format with an
          # explicit tab separator (`%x09`) so subject text containing
          # spaces or colons parses cleanly.
          FAIL=0
          FAIL_REPORT=""
          COUNT=0

          while IFS=$'\t' read -r sha subject; do
            [[ -z "${sha}" ]] && continue
            COUNT=$((COUNT + 1))

            if [[ "${subject}" =~ NFM-[0-9]+ ]]; then
              printf 'OK   %s  %s\n' "${sha}" "${subject}"
              continue
            fi

            if [[ "${subject}" == *"[no-issue]"* ]]; then
              printf 'OK   %s  %s  [no-issue]\n' "${sha}" "${subject}"
              continue
            fi

            if [[ "${subject}" == 'Revert "'* ]]; then
              printf 'OK   %s  %s  [Revert]\n' "${sha}" "${subject}"
              continue
            fi

            FAIL=1
            FAIL_REPORT+="FAIL ${sha}  ${subject}"$'\n'
          done < <(git log --format='%H%x09%s' --no-merges --reverse "${MERGE_BASE}..${HEAD_SHA}")

          if [[ "${COUNT}" -eq 0 ]]; then
            echo "All commits in the PR range are merge commits — nothing to validate."
            exit 0
          fi

          if [[ "${FAIL}" -eq 1 ]]; then
            {
              echo ""
              echo "::error title=Commit subject gate::Commit subject gate FAILED — every non-merge commit subject must reference NFM-###, contain the literal '[no-issue]' token, or start with 'Revert \"'."
              echo ""
              echo "Failing commits:"
              echo "${FAIL_REPORT}"
            } >&2
            exit 1
          fi

          echo ""
          echo "All ${COUNT} non-merge commits in PR pass the gate."