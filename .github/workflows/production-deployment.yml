---
# This workflow handles the production deployment of the NFMD system.
# It includes testing, building, security scanning, and deployment with rollback capability.

name: Production Deployment

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # =============================================================================
  # Fast-fail egress probe (NFM-3842, F1 fixed)
  # ----------------------------------------------------------------------
  # Surfaces a dead-egress state in ≤ 2 min instead of waiting 20 min for
  # the alembic-on-main job to time out its checkout. The downstream
  # self-hosted jobs (migration-on-main-assert, pre-deploy-assert-smoke,
  # and via `needs` the rest) use SSH egress via ssh.github.com:443 —
  # see their "Configure SSH egress" steps — so this probe targets the
  # SAME path. Probing HTTPS-direct would dead-code the SSH fix in the
  # very failure mode it targets (HTTPS blocked, SSH works): pre-flight
  # would fail and gate the four downstream jobs via `needs: [...,
  # pre-flight, ...]`, making the SSH path unreachable.
  #
  # `ssh-keyscan` exercises the same SSH handshake the downstream
  # `actions/checkout` will use, over port 443, and reads the host key
  # as a side effect (priming known_hosts for the downstream jobs).
  # On healthy egress this returns in <1 s; on dead egress it returns in
  # 5 s (the `-T` ConnectTimeout).
  # =============================================================================
  pre-flight:
    name: Egress fast-fail probe (NFM-3842)
    runs-on: [self-hosted, production]
    timeout-minutes: 2
    steps:
      - name: Probe ssh.github.com:443 (NFM-3842 F1 fix)
        run: |
          if ssh-keyscan -p 443 -T 5 ssh.github.com >/dev/null 2>&1; then
            echo "ssh.github.com:443 reachable (SSH egress OK)"
            exit 0
          fi
          echo "::error::ssh.github.com:443 unreachable after 5 s."
          echo "::error::The SSH egress alias regressed or the runner's network state changed."
          echo "::error::See NFM-3837 (root cause) and NFM-3842 (workflow fix)."
          exit 1

  # =============================================================================
  # Pre-deployment Checks
  # =============================================================================
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint .github/ --format colored

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Run security scan
        run: |
          chmod +x apps/api/scripts/security-scan.sh
          ./apps/api/scripts/security-scan.sh

      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-results
          path: |
            security-scan-results.*

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run linting
        run: uv run ruff check src tests

  # =============================================================================
  # Testing
  # =============================================================================
  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: [type-check]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-results
          path: |
            apps/web/playwright-report/
            apps/web/coverage/

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [python-lint]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run unit tests
        run: uv run pytest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: |
            apps/api/coverage.xml
            apps/api/htmlcov/

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [test-web, test-api]
    if: always()
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Start API server
        env:
          PYTHONPATH: src:.
        run: |
          uv run uvicorn nfm_db.main:app &
          echo $! > api.pid
          echo "Waiting for API to start..."
          sleep 15

      - name: Run performance tests
        run: |
          uv run --with locust locust -f tests/performance/locustfile.py \
            --headless --users 20 --spawn-rate 2 --run-time 3m \
            --host http://localhost:8000 \
            --csv perf_results --html perf_report.html \
            --only-summary || true
          echo "Performance tests completed (failures may be expected without a database)"

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-results
          path: |
            apps/api/perf_results_*
            apps/api/perf_report.html

      - name: Cleanup API server
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
            rm api.pid
          fi

  # =============================================================================
  # Build
  # =============================================================================
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: [test-web]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: apps/web/.next

  # =============================================================================
  # P1/D2 — NFM-2149 / ADR-NFM-2139 §5 D2
  # ----------------------------------------------------------------------
  # Pre-deploy DB↔code Alembic assertion. Builds the candidate api image
  # with an explicit `:candidate-<sha>` tag (preserves the prior `:latest`
  # image so the workflow can be aborted mid-run without losing state),
  # then verifies the prod DB's `alembic_version.version_num` exists in
  # the candidate and `alembic heads` shows exactly one head.
  #
  # The candidate image is also tagged as `:latest` so deploy-prod's
  # `docker compose ... up -d` (without `--build`) starts the image the
  # assertion just inspected. This is Option 2 from the NFM-2149 spec
  # and makes the D1 (NFM-2145) SHA-tag follow-up a one-line change.
  #
  # A failed assertion exits with a distinct code (64 = EX_USAGE,
  # missing-revision) so `deploy-prod` (which has `needs: [...] including
  # this job`) is **skipped**, not run.
  # =============================================================================
  pre-deploy-assert:
    name: Pre-deploy DB↔code alembic assertion
    runs-on: [self-hosted, production]
    needs: [pre-flight, build-web, test-api]
    if: always() && needs.build-web.result == 'success' && needs.test-api.result == 'success'
    env:
      HTTP_PROXY: http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
      HTTPS_PROXY: http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
      NO_PROXY: localhost,127.0.0.1,10.0.0.0/8,172.17.0.0/16,192.168.0.0/16,github.com,.githubusercontent.com,.githubassets.com,nucpot.dpdns.org,verify.nucpot.dpdns.org
      # ADR §5 D2 "distinct exit code". 64 = EX_USAGE (sysexits.h).
      # The smoke-test job uses a different value (42) so the two jobs
      # never collide on a single exit-code namespace.
      ASSERT_DISTINCT_EXIT: "64"
    steps:
      - name: Warm up direct route to github.com (GFW transience)
        working-directory: ${{ github.workspace }}
        run: |
          # Direct github.com TLS is intermittently killed by GFW. Probe
          # until it answers so the checkout's git fetch lands on a live
          # route instead of racing a 75s connect timeout. Must run before
          # checkout with an absolute working-directory (repo dirs don't
          # exist yet; job defaults point at apps/* subdirs).
          for i in 1 2 3 4 5; do
            curl -sf --max-time 10 -o /dev/null https://github.com && { echo "github.com reachable (attempt $i)"; exit 0; }
            echo "github.com not reachable (attempt $i), waiting 15s..."; sleep 15
          done
          echo "WARNING: github.com still unreachable after 5 attempts; checkout may fail"
      - uses: actions/checkout@v7

      - name: Verify env key sync (NFM-2406)
        run: |
          # Runs before the candidate build on purpose: env drift is a
          # sub-second check and the build below is --no-cache, so failing
          # here saves several minutes of pointless work.
          #
          # This must run over SSH rather than against the checkout above,
          # because .env.prod and docker/.env.prod are gitignored — they exist
          # only on the production host. `git pull` first so the check runs the
          # script from the commit being deployed, not the last deploy's copy.
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key lwj04@127.0.0.1 << 'ENDSSH'
            set -euo pipefail
            cd ~/Projects/nucpot
            export HTTP_PROXY=http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }} HTTPS_PROXY=http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
            # github.com must go DIRECT: the proxy route for it is dead
            # (verified 5/5 fail via proxy, 5/5 pass direct). SSH sessions
            # do not inherit job env, so this must be re-exported here.
            export NO_PROXY=localhost,127.0.0.1,github.com,.githubusercontent.com,.githubassets.com
            export no_proxy=$NO_PROXY
            for i in 1 2 3 4 5; do
              git fetch origin main && break
              [ "$i" = 5 ] && { echo "FATAL: git fetch failed 5x"; exit 1; }
              echo "git fetch failed (attempt $i), retrying in 15s..."; sleep 15
            done
            git reset --hard origin/main

            echo "===> Checking .env.prod <-> docker/.env.prod key drift..."
            # Only key *names* are printed, never values — safe for CI logs.
            bash scripts/verify-env-sync.sh
          ENDSSH

      - name: Build candidate api image
        env:
          DOCKER_CONFIG: /tmp/no-cred-docker-config
        run: |
          # Compute CANDIDATE_TAG in the workflow shell (where $GITHUB_ENV is bound
          # by GitHub Actions) and pass it to the SSH heredoc. Writing to $GITHUB_ENV
          # inside the SSH heredoc fails with `set -u` because the variable is unset
          # in the remote shell.
          SHORT_SHA="$(git rev-parse --short HEAD)"
          CANDIDATE_TAG="nucpot-prod-api:candidate-${SHORT_SHA}"
          echo "CANDIDATE_TAG=${CANDIDATE_TAG}" >> "$GITHUB_ENV"

          # Ensure DOCKER_CONFIG exists on the remote host before SSH (NFM-2564).
          # The SSH heredoc opens a new shell that does NOT inherit GHA env vars,
          # so DOCKER_CONFIG must be set explicitly inside the heredoc to prevent
          # docker-credential-desktop from prompting for the locked keychain.
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key lwj04@127.0.0.1 << ENDSSH
            set -euo pipefail
            cd ~/Projects/nucpot
            export HTTP_PROXY=http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }} HTTPS_PROXY=http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
            # github.com must go DIRECT: the proxy route for it is dead
            # (verified 5/5 fail via proxy, 5/5 pass direct). SSH sessions
            # do not inherit job env, so this must be re-exported here.
            export NO_PROXY=localhost,127.0.0.1,github.com,.githubusercontent.com,.githubassets.com
            export no_proxy=$NO_PROXY
            # NFM-848: SSH heredoc opens a fresh shell that does NOT inherit
            # GHA env vars. Docker Desktop rewrites credsStore:"desktop" into
            # NFM-3328: rebuild deploy keychain failure chain. DOCKER_CONFIG
            # is honored by the docker CLI (a bogus credsStore pointer made
            # `docker pull` return 404 in 2026-08-16 controlled tests).
            # NFM-848: GHA shell expands \$-vars; the runner env has no USER/
            # HOME set, which made the earlier \${USER} form expand to an
            # empty string and `mkdir -p ""` fail. Use literal paths so the
            # heredoc never depends on env inheritance.
            export DOCKER_CONFIG=/tmp/nfm848-no-cred-docker-config
            mkdir -p /tmp/nfm848-no-cred-docker-config
            printf '{}' > /tmp/nfm848-no-cred-docker-config/config.json
            for i in 1 2 3 4 5; do
              git fetch origin main && break
              [ "$i" = 5 ] && { echo "FATAL: git fetch failed 5x"; exit 1; }
              echo "git fetch failed (attempt $i), retrying in 15s..."; sleep 15
            done
            git reset --hard origin/main

            echo "===> Building candidate image ${CANDIDATE_TAG}..."
            # --no-cache prevents stale COPY layers (root cause of NFM-2376:
            # Docker layer cache served a migrations/ layer predating 036)
            echo "[diagnostic] git HEAD: $(git rev-parse --short HEAD)"
            echo "[diagnostic] 036 migration: $(ls apps/api/migrations/versions/036_* 2>/dev/null || echo 'NOT FOUND')"
            # NFM-2502: do not inherit HTTP_PROXY for Docker build — apt uses
            # CN mirrors directly; proxy can return transient 502 for .deb.
            # NFM-848: BUILDKIT=0 keeps metadata resolution inside the daemon
            # (anonymous pull) instead of the buildx host-side credential
            # helper path, which needs the (locked) keychain in sshd sessions.
            HTTP_PROXY= HTTPS_PROXY= DOCKER_BUILDKIT=0 \
            docker build --no-cache -f docker/prod-api.Dockerfile -t "${CANDIDATE_TAG}" .

            # Tag as :latest so deploy-prod's `up -d` (without --build)
            # starts the image the assertion just inspected. The candidate
            # tag is preserved as the rollback primitive (D1 follow-up).
            docker tag "${CANDIDATE_TAG}" nucpot-prod-api:latest
            echo "===> Candidate image ready:"
            docker images --format '  {{.Repository}}:{{.Tag}} ({{.CreatedSince}}, {{.Size}})' \
              | grep '^nucpot-prod-api' || true
          ENDSSH

      - name: Run pre-deploy DB↔code alembic assertion
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key lwj04@127.0.0.1 << ENDSSH
            set -euo pipefail
            cd ~/Projects/nucpot
            export HTTP_PROXY=http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }} HTTPS_PROXY=http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
            # github.com must go DIRECT: the proxy route for it is dead
            # (verified 5/5 fail via proxy, 5/5 pass direct). SSH sessions
            # do not inherit job env, so this must be re-exported here.
            export NO_PROXY=localhost,127.0.0.1,github.com,.githubusercontent.com,.githubassets.com
            export no_proxy=$NO_PROXY
            # NFM-848: literal path — this heredoc is UNQUOTED so the local
            # GHA shell expands \$-vars; the runner env has no USER/HOME set,
            # which made the earlier \${USER} form expand to an empty string.
            export DOCKER_CONFIG=/tmp/nfm848-no-cred-docker-config
            mkdir -p /tmp/nfm848-no-cred-docker-config
            printf '{}' > /tmp/nfm848-no-cred-docker-config/config.json
            echo "===> Running pre-deploy-assert against ${CANDIDATE_TAG}..."
            bash tools/pre-deploy-assert-smoke/assert.sh \
              --image "${CANDIDATE_TAG}" \
              --db-container nucpot-prod-db \
              --db-user "${PROD_POSTGRES_USER:-nfm}" \
              --db-name "${PROD_POSTGRES_DB:-nfm_db}" \
              --distinct-exit "${ASSERT_DISTINCT_EXIT}"
            echo "===> ASSERT_OK: deploy-prod is unblocked"
          ENDSSH

  # =============================================================================
  # P1/D4 — NFM-2141: alembic HEAD file-commit must be an ancestor of
  # origin/main. Catches the NFM-1692/2104/2136 class where a migration is
  # stamped to prod from a branch that is not yet merged; the next deploy
  # from main then crash-loops because alembic cannot resolve the DB's
  # current revision. Complements pre-deploy-assert (which only checks the
  # candidate image contains the file the DB has).
  #
  # Runs in the same checkout so the git merge-base --is-ancestor call is
  # anchored to the commit being deployed. Override path (NFM-2141 AC #2):
  # pass --override-rationale "<text>" via workflow_dispatch input; the
  # rationale is recorded in $AUDIT_LOG on the prod host.
  # =============================================================================
  migration-on-main-assert:
    name: Pre-deploy alembic-on-main assertion (NFM-2141)
    runs-on: [self-hosted, production]
    needs: [pre-flight, build-web, test-api, pre-deploy-assert]
    if: always() && needs.build-web.result == 'success' && needs.test-api.result == 'success' && needs.pre-deploy-assert.result == 'success'
    env:
      HTTP_PROXY: http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
      HTTPS_PROXY: http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
      NO_PROXY: localhost,127.0.0.1,10.0.0.0/8,172.17.0.0/16,192.168.0.0/16,github.com,.githubusercontent.com,.githubassets.com
      AUDIT_LOG: "${{ github.workspace }}/migration-on-main-audit.jsonl"
    steps:
      - name: Configure SSH egress via ssh.github.com:443 (NFM-3842)
        # NFM-3837 root cause: direct github.com:443 is GFW-blocked on
        # wenjiedeMac-Studio, but ssh.github.com:443 reaches GitHub through
        # the existing SSH egress alias. The runner-local key
        # ~/.ssh/id_ed25519_paperclip_egress is the durable fix; this step
        # rewires GitHub SSH transport to use it. actions/checkout below
        # uses HTTPS by default — the global gitconfig rewrite
        # (`url.git@github.com:.insteadOf https://github.com/`) turns the
        # clone URL into SSH shorthand, which then resolves via this
        # config to ssh.github.com:443.
        run: |
          set -euo pipefail
          KEY=~/.ssh/id_ed25519_paperclip_egress
          test -f "$KEY" || { echo "::error::$KEY not present on runner — see NFM-3842 acceptance"; exit 1; }
          chmod 600 "$KEY"
          mkdir -p ~/.ssh
          {
            echo "Host github.com"
            echo "  HostName ssh.github.com"
            echo "  Port 443"
            echo "  IdentityFile $KEY"
            echo "  User git"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -p 443 ssh.github.com 2>/dev/null >> ~/.ssh/known_hosts || true
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          echo "SSH egress configured: github.com → ssh.github.com:443 (key $KEY)"
      - name: Warm up direct route to github.com (GFW transience, belt-and-braces)
        working-directory: ${{ github.workspace }}
        run: |
          # NFM-3842: the primary egress path is now SSH (above), but
          # keep this HTTPS probe as a regression canary — if direct
          # github.com answers, it means a proxy is up and the SSH alias
          # may be unnecessary for this run. Failures here are warnings,
          # not errors, because the SSH path can still succeed.
          for i in 1 2 3 4 5; do
            curl -sf --max-time 10 -o /dev/null https://github.com && { echo "github.com reachable (attempt $i)"; exit 0; }
            echo "github.com not reachable (attempt $i), waiting 15s..."; sleep 15
          done
          echo "WARNING: github.com still unreachable after 5 attempts; relying on SSH egress alias"
      - uses: actions/checkout@v7

      - name: Run migration-on-main-assert against candidate image
        run: |
          # NFM-848: CANDIDATE_TAG was written to GITHUB_ENV inside the
          # pre-deploy-assert job — GITHUB_ENV writes do NOT cross job
          # boundaries, so this job always saw it empty and the script
          # failed with "ERROR: --image is required". Recompute the tag
          # here from the same deterministic formula (SHORT_SHA of HEAD).
          SHORT_SHA="$(git rev-parse --short HEAD)"
          CANDIDATE_TAG="nucpot-prod-api:candidate-${SHORT_SHA}"
          echo "CANDIDATE_TAG=${CANDIDATE_TAG}"
          bash tools/migration-on-main-assert/assert.sh \
            --image "${CANDIDATE_TAG}" \
            --base-ref origin/main \
            --repo-root "${{ github.workspace }}" \
            --audit-log "${AUDIT_LOG}"
          echo "===> ASSERT_OK: alembic HEAD file-commit is on origin/main"

      - name: Upload audit log on override
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-on-main-audit-${{ github.run_id }}
          path: migration-on-main-audit.jsonl
          if-no-files-found: ignore

  # =============================================================================
  # P1/D2 — NFM-2149 regression test (live-Docker integration)
  # ----------------------------------------------------------------------
  # Wires the smoke harness into CI so a regression in `assert.sh` breaks
  # the build before it breaks prod. Runs on the self-hosted production
  # runner (Docker daemon + network to pull pgvector/pgvector:pg16).
  # =============================================================================
  pre-deploy-assert-smoke:
    name: Pre-deploy-assert smoke test (NFM-2149)
    runs-on: [self-hosted, production]
    needs: [pre-flight]
    env:
      HTTP_PROXY: http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
      HTTPS_PROXY: http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
      NO_PROXY: localhost,127.0.0.1,10.0.0.0/8,172.17.0.0/16,192.168.0.0/16,github.com,.githubusercontent.com,.githubassets.com
    steps:
      - name: Configure SSH egress via ssh.github.com:443 (NFM-3842)
        # Mirror of the migration-on-main-assert fix. Direct github.com
        # is GFW-blocked on wenjiedeMac-Studio; route through the
        # existing SSH egress alias using the runner-local key. See
        # the migration-on-main-assert job for the full rationale.
        run: |
          set -euo pipefail
          KEY=~/.ssh/id_ed25519_paperclip_egress
          test -f "$KEY" || { echo "::error::$KEY not present on runner — see NFM-3842 acceptance"; exit 1; }
          chmod 600 "$KEY"
          mkdir -p ~/.ssh
          {
            echo "Host github.com"
            echo "  HostName ssh.github.com"
            echo "  Port 443"
            echo "  IdentityFile $KEY"
            echo "  User git"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -p 443 ssh.github.com 2>/dev/null >> ~/.ssh/known_hosts || true
          git config --global url."git@github.com:".insteadOf "https://github.com/"
      - name: Warm up direct route to github.com (GFW transience, belt-and-braces)
        working-directory: ${{ github.workspace }}
        run: |
          # NFM-3842: belt-and-braces HTTPS probe. Primary egress is now
          # SSH via the config above; this loop is a regression canary.
          # Warnings only — SSH path can still succeed.
          for i in 1 2 3 4 5; do
            curl -sf --max-time 10 -o /dev/null https://github.com && { echo "github.com reachable (attempt $i)"; exit 0; }
            echo "github.com not reachable (attempt $i), waiting 15s..."; sleep 15
          done
          echo "WARNING: github.com still unreachable after 5 attempts; relying on SSH egress alias"
      - uses: actions/checkout@v7

      - name: Run assert.sh unit tests (no Docker required)
        # Catches logical regressions in the bash script even when the
        # live-Docker smoke below is skipped (PR runners don't have Docker).
        run: |
          python3 -m pytest tools/pre-deploy-assert-smoke/test_assert.py -v
          python3 -m pytest tools/migration-on-main-assert/test_assert.py -v
          # NFM-3320 AC-4: post-deploy cutover assertion. Runs without
          # Docker (fake-docker shim on PATH) so it executes on PR runners.
          # Catches logical regressions in the cutover assertion even when
          # the live-Docker deploy-prod job is skipped.
          python3 -m pytest tools/post-deploy-cutover-assert/test_assert.py -v
          # NFM-3448: candidate-tag retention prune. Same fake-docker shim
          # pattern as the cutover assertion; runs without the daemon so
          # it executes on PR runners and catches regressions in
          # `tools/prod-tag-retention/prune.sh` before they reach prod.
          python3 -m pytest tools/prod-tag-retention/test_prune.py -v

      # ===================================================================
      # NFM-2564 fix (2026-08-08): buildkit's default creds helper is
      # `desktop` → docker-credential-desktop tries to prompt for the
      # keychain in a non-interactive runner session and FAILS. Override
      # to `DOCKER_CONFIG=/tmp/empty-docker-config` so neither buildkit
      # nor classic docker invokes any credential helper, then pre-pull
      # both images via classic `docker pull` (which honors shell proxy
      # vars). buildkit then reuses the local cache without needing
      # network. See memory: nucpot-deploy / docker-pull-via-keychain pitfall.
      # ===================================================================
      - name: Pre-pull images without credential helper (NFM-2564)
        env:
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897
          NO_PROXY: localhost,127.0.0.1,10.0.0.0/8,172.17.0.0/16,192.168.0.0/16,github.com,.githubusercontent.com,.githubassets.com
        run: |
          # NFM-848 root cause re-verified 2026-08-16 (empirical):
          # DOCKER_CONFIG *is* honored by the docker CLI (a bogus credsStore
          # under DOCKER_CONFIG fails immediately). The old "DOCKER_CONFIG
          # does not work" belief came from SSH heredocs dropping the env
          # var — not from Docker Desktop ignoring it.
          #
          # Docker Desktop rewrites credsStore:"desktop" into
          # ~/.docker/config.json whenever Desktop restarts. The runner
          # session is non-interactive, so the keychain is locked and
          # docker-credential-desktop fails. Point DOCKER_CONFIG at a clean
          # scratch dir: no credsStore → no credential helper → no keychain.
          export DOCKER_CONFIG="$RUNNER_TEMP/no-cred-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}' > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG (credsStore-free)"
          # Skip pull if images already cached locally — avoids any network
          # round-trip; credential helper is already bypassed above.
          # NFM-2564 follow-up (run 32612021153): pulling through Docker
          # Desktop's daemon can still hit credsStore:"desktop" → locked
          # keychain in non-interactive sessions even WITH the clean
          # DOCKER_CONFIG (daemon-side auth path). The pull here is an
          # optimization, not a correctness gate — smoke.sh fails loudly on
          # its own if an image is truly missing. So: advisory only.
          PULL_FAILED=0
          for img in alpine:3.20 pgvector/pgvector:pg16; do
            if docker image inspect "$img" > /dev/null 2>&1; then
              echo "Image $img already cached, skipping pull"
            else
              if ! docker pull "$img"; then
                echo "::warning::docker pull $img failed (keychain/daemon auth); smoke.sh will surface a clear error if the image is truly needed"
                PULL_FAILED=1
              fi
            fi
          done
          docker image ls alpine:3.20 && docker image ls pgvector/pgvector:pg16

      - name: Run smoke.sh (live Docker + postgres)
        # Simulates NFM-2135: DB stamped to revision X, image lacks X,
        # verify workflow refuses with the distinct exit code + log names X.
        # Then verifies the success path: image has X → exit 0.
        # DOCKER_CONFIG inherits from pre-pull step so buildkit skips the
        # keychain prompt.
        env:
          DOCKER_CONFIG: /tmp/no-cred-docker-config
        run: |
          bash tools/pre-deploy-assert-smoke/smoke.sh

  # =============================================================================
  # Deployment
  # =============================================================================
  # NFM-586 / NFM-593: Self-hosted runner on Mac Studio (same machine as
  # production Docker stack). Deploy uses loopback SSH (127.0.0.1) over the
  # host's OpenSSH sshd — same pattern as staging (NFM-150 rev 2).
  # No external SSH needed. DEPLOY_HOST/DEPLOY_KEY/DEPLOY_USER secrets are
  # no longer consumed by this workflow and can be deleted.
  #
  # NFM-2149 / ADR-NFM-2139 §5 D2: deploy-prod is gated by pre-deploy-assert.
  # The `up -d` is run WITHOUT `--build` (the candidate image was already
  # built and tagged in the pre-deploy-assert job). The candidate tag is
  # preserved as a rollback primitive for the D1 (NFM-2145) follow-up.
  # =============================================================================
  deploy-prod:
    name: Deploy Production (Docker Compose)
    runs-on: [self-hosted, production]
    needs: [pre-flight, build-web, test-api, pre-deploy-assert, migration-on-main-assert]
    if: always() && needs.build-web.result == 'success' && needs.pre-deploy-assert.result == 'success' && needs.migration-on-main-assert.result == 'success'
    env:
      HTTP_PROXY: http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
      HTTPS_PROXY: http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
      NO_PROXY: localhost,127.0.0.1,10.0.0.0/8,172.17.0.0/16,192.168.0.0/16,github.com,.githubusercontent.com,.githubassets.com,nucpot.dpdns.org,verify.nucpot.dpdns.org
      # NFM-2148 / ADR-NFM-2139 §5 D1: pin every image to the deploying
      # commit SHA. The deploy heredoc re-exports this on the host so the
      # compose step and the manual rollback recipe both use the same tag.
      PROD_IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Warm up direct route to github.com (GFW transience)
        working-directory: ${{ github.workspace }}
        run: |
          # Direct github.com TLS is intermittently killed by GFW. Probe
          # until it answers so the checkout's git fetch lands on a live
          # route instead of racing a 75s connect timeout. Must run before
          # checkout with an absolute working-directory (repo dirs don't
          # exist yet; job defaults point at apps/* subdirs).
          for i in 1 2 3 4 5; do
            curl -sf --max-time 10 -o /dev/null https://github.com && { echo "github.com reachable (attempt $i)"; exit 0; }
            echo "github.com not reachable (attempt $i), waiting 15s..."; sleep 15
          done
          echo "WARNING: github.com still unreachable after 5 attempts; checkout may fail"
      - uses: actions/checkout@v7

      - name: Deploy via Docker Compose (loopback SSH)
        id: deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key lwj04@127.0.0.1 << 'ENDSSH'
            # NFM-3328: fail-fast. Prior deploys slid past failed steps (build
            # errors, `docker compose` unavailable) into green health checks
            # against stale containers — four consecutive false-success deploys
            # (2026-08-18..19). Without -e the heredoc reports the exit code of
            # the LAST command only; every intermediate failure was swallowed.
            set -euo pipefail
            cd ~/Projects/nucpot
            export HTTP_PROXY=http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }} HTTPS_PROXY=http://127.0.0.1:${{ vars.PROXY_PORT || '7897' }}
            # github.com must go DIRECT: the proxy route for it is dead
            # (verified 5/5 fail via proxy, 5/5 pass direct). SSH sessions
            # do not inherit job env, so this must be re-exported here.
            export NO_PROXY=localhost,127.0.0.1,github.com,.githubusercontent.com,.githubassets.com
            export no_proxy=$NO_PROXY
            export DOCKER_CONFIG=/tmp/nfm848-no-cred-docker-config
            mkdir -p /tmp/nfm848-no-cred-docker-config/cli-plugins
            printf '{}' > /tmp/nfm848-no-cred-docker-config/config.json
            # NFM-3777/#1050: stale-marker poisoning (seen 2026-08-18 and in
            # NFM-3845 UPDATE 4) — a leftover /tmp/nfmd_prod_health_passed from
            # a PRIOR deploy made the emit fragment report
            # "health-gate-first-poll-passed true" for a deploy that never cut
            # over. Scrub it at the top of every deploy so the marker can only
            # ever attest to THIS run's health gate.
            rm -f /tmp/nfmd_prod_health_passed
            # NFM-3328: DOCKER_CONFIG redirects the CLI-plugin search path, so
            # an otherwise-empty config dir SILENTLY REMOVES `docker compose`
            # (verified empirically: `docker compose version` → "unknown
            # command"). Every `docker compose -f ...` line then failed with
            # "unknown shorthand flag: 'f'" and the deploy continued on stale
            # containers. Symlink the host's compose plugin into the override
            # dir to keep compose available without restoring the keychain.
            ln -sf ~/.docker/cli-plugins/docker-compose \
              /tmp/nfm848-no-cred-docker-config/cli-plugins/docker-compose
            docker compose version

            # NFM-2148 / ADR-NFM-2139 §5 D1: pin every image to the deploying
            # commit SHA so a bad deploy can be rolled back by re-tagging, not
            # by rebuilding. The local daemon keeps the last 10 successful
            # nucpot-prod-* tags per repository (see prune step at end).
            export PROD_IMAGE_TAG="${{ github.sha }}"
            echo "==> Deploying with PROD_IMAGE_TAG=${PROD_IMAGE_TAG}"

            for i in 1 2 3 4 5; do
              git fetch origin main && break
              [ "$i" = 5 ] && { echo "FATAL: git fetch failed 5x"; exit 1; }
              echo "git fetch failed (attempt $i), retrying in 15s..."; sleep 15
            done
            git reset --hard origin/main

            # Build the 3 distinct images (D1, NFM-2148). The api image is
            # shared by the api and worker services (docker-compose.prod.yml:62,
            # :216), so one build tag covers both. --build is BANNED below in
            # the compose step — it would re-tag the new image as `latest` and
            # destroy the prior SHA-tagged image, breaking rollback.
            # pre-deploy-assert (D2, NFM-2149) has already validated the
            # DB↔code alembic match against the candidate image before this
            # point; see the pre-deploy-assert job in this workflow.
            # --no-cache on all builds (NFM-2376 root cause: stale layer cache)
            echo "==> Building nucpot-prod-api:${PROD_IMAGE_TAG}"
            # NFM-2502: clear proxy for Docker build (apt/pip use CN mirrors directly)
            # NFM-848: BUILDKIT=0 — daemon-side metadata resolution, no keychain
            HTTP_PROXY= HTTPS_PROXY= DOCKER_BUILDKIT=0 \
            docker build --no-cache -t "nucpot-prod-api:${PROD_IMAGE_TAG}" -f docker/prod-api.Dockerfile .

            echo "==> Building nucpot-prod-lightrag:${PROD_IMAGE_TAG}"
            DOCKER_BUILDKIT=0 \
            docker build --no-cache -t "nucpot-prod-lightrag:${PROD_IMAGE_TAG}" \
              -f docker/lightrag.Dockerfile --build-arg LIGHTRAG_VERSION=1.5.4 .

            echo "==> Building nucpot-prod-web:${PROD_IMAGE_TAG}"
            DOCKER_BUILDKIT=0 \
            docker build --no-cache -t "nucpot-prod-web:${PROD_IMAGE_TAG}" \
              -f docker/web.Dockerfile \
              --build-arg API_SERVER_URL=http://nucpot-prod-api:8000 \
              --build-arg LIGHTRAG_WEBUI_URL=http://nucpot-prod-lightrag:9621 .

            # NFM-2146 / ADR-NFM-2139 §5 D3 (revised by NFM-2196): deploy-time
            # migration runs BEFORE the new containers come up. The Postgres
            # advisory lock (key 7423912) is acquired by env.py on the
            # migration's own async connection (apps/api/migrations/env.py:
            # run_async_migrations), so concurrent migrators (cron jobs,
            # manual ssh, parallel CI) block at the SQL level until the
            # in-flight migration disconnects. The shell-level acquire loop
            # the NFM-2146 v1 used was a no-op (session-level lock released
            # on session-end before alembic started). The script runs
            # `alembic upgrade head` inside an ephemeral api container
            # (overridden entrypoint); a migration failure aborts the deploy
            # before any traffic is cut over — failure-mode shift from "502
            # on boot" to "failed deploy step" (alertable, retryable). See
            # scripts/prod_migrate.sh for the orchestration and
            # apps/api/migrations/env.py for the lock primitive.
            ./scripts/prod_migrate.sh

            # NFM-3320 AC-1/AC-2 — post-deploy cutover assertion. The 2026-08-18
            # incident showed that `docker compose ... up -d` can return success
            # while leaving the old containers in place. We now snapshot every
            # nucpot-prod-* service container before `up -d` (Image ID + Created
            # timestamp) and re-assert after, refusing to declare a green deploy
            # unless each running container's Image ID matches a SHA-tagged image
            # that was actually built this run, AND its Created timestamp moved
            # forward. Distinct exit codes (71/72/73/74) let the workflow branch
            # (skipped/failure) on the failure type.
            #
            # The snapshot directory lives on the host because the deploy-prod
            # job runs on the Mac Studio self-hosted runner (loopback SSH) and
            # /tmp survives both phases inside the same heredoc.
            #
            # NFM-3777: `docker compose run ... < /dev/null` in prod_migrate.sh
            # above can leave the SSH heredoc's stdin in a state that swallows
            # every subsequent command (observed 2026-08-28 on run 33139959669:
            # build + alembic succeed, cutover segment completely silent, prod
            # stays on the old image, job still green). Reset stdin to a known
            # terminal-less FD here and emit a HEREDOC-START anchor so future
            # silent-exit incidents are diagnosable from logs alone.
            exec 0</dev/null
            echo "==> HEREDOC CUTOVER START (anchor for NFM-3777 diagnosis)"
            export NFM_CUTOVER_SNAPSHOT_DIR="/tmp/nfm-cutover-${PROD_IMAGE_TAG}"
            rm -rf "${NFM_CUTOVER_SNAPSHOT_DIR}"
            echo "==> Capturing BEFORE snapshot of nucpot-prod-* containers..."
            bash tools/post-deploy-cutover-assert/assert.sh \
              --phase before \
              --snapshot-dir "${NFM_CUTOVER_SNAPSHOT_DIR}"

            # Restart ALL containers using the SHA-tagged images. PROD_IMAGE_TAG
            # resolves each service's `image:` (docker-compose.prod.yml:62, :126,
            # :216, :275) to the matching SHA-tagged image we just built.
            # Schema authority is unchanged: Alembic-only via apps/api/migrations/
            # versions/, applied deploy-time by the step above (NFM-2146), not
            # on container boot (D3).
            docker compose -f docker-compose.prod.yml --env-file docker/.env.prod up -d

            # Wait for services to start
            sleep 20

            # NFM-3320 AC-1/AC-2 (continued) — AFTER-phase assertion. Hard-fails
            # the deploy step on image-digest mismatch (exit 71), no-recreate
            # (exit 72), missing expected tag (exit 73), or missing service
            # container (exit 74). On success, prints the before/after cutover
            # table so the reviewer can confirm a real cutover happened.
            #
            # This must run BEFORE the curl health checks — the original 2026-08-18
            # bug was: curl against the old (still-healthy) containers returns
            # 200 and the workflow reports green. The whole point of this
            # assertion is to be the FIRST signal that the new code is live, with
            # health checks serving as confirmation rather than the gate.
            echo "==> Asserting post-deploy cutover (expected tag: ${PROD_IMAGE_TAG})..."
            bash tools/post-deploy-cutover-assert/assert.sh \
              --phase after \
              --expected-tag "${PROD_IMAGE_TAG}" \
              --snapshot-dir "${NFM_CUTOVER_SNAPSHOT_DIR}" \
              --distinct-exit 71

            # Schema authority: Alembic-only (ADR-NFM-2139 §5 D4, deploy-time
            # migration per §5 D3 — NFM-2146). All DDL is applied through
            # Alembic revisions under apps/api/migrations/versions/ by the
            # deploy step above. No path in this deploy writes to the prod DB
            # except through Alembic.

            # Internal health checks — the first curl-f is the production
            # equivalent of staging's first-poll gate (ADR-KR3-A2 §Failure-mode 6).
            # We write a marker file on success so the "Emit prod deploy-event
            # fragment" post-step can read the outcome without re-parsing the
            # heredoc. The deploy-prod job runs on a self-hosted runner on the
            # same Mac Studio host (header comment lines 270-275), so the
            # runner's /tmp is the host's /tmp.
            echo "Checking API health..."
            rm -f /tmp/nfmd_prod_health_passed
            if curl -f http://localhost:8001/api/v1/health; then
              touch /tmp/nfmd_prod_health_passed
            else
              exit 1
            fi

            echo "Checking Web health..."
            curl -f http://localhost:3000/ || exit 1

            # NFM-2148 / ADR-NFM-2139 §5 D1 retention: keep the most-recent
            # 10 nucpot-prod-* tags per repository in the local daemon. Tags
            # are sorted by Docker's CreatedAt timestamp; everything past the
            # 10th newest is removed. The new SHA we just built is always
            # newest, so it is never pruned. Disk cap: ~60-80 GB on the
            # Mac Studio (4 images × 10 tags × ~1.5-2 GB).
            echo "==> Pruning nucpot-prod-* tags older than the last 10 per repository"
            for REPO in nucpot-prod-api nucpot-prod-lightrag nucpot-prod-web; do
              OLD_IDS=$(docker images --format '{{.Repository}}|{{.Tag}}|{{.ID}}|{{.CreatedAt}}' \
                | grep "^${REPO}|" \
                | sort -t'|' -k4,4 -r \
                | tail -n +11 \
                | cut -d'|' -f3 \
                | sort -u)
              if [ -n "$OLD_IDS" ]; then
                echo "    removing old ${REPO} tags: $(echo "$OLD_IDS" | tr '\n' ' ')"
                echo "$OLD_IDS" | xargs -r docker image rm -f
              else
                echo "    ${REPO}: nothing to prune"
              fi
            done

            # NFM-3448: candidate-tag retention. The pre-deploy-assert job
            # (ADR-NFM-2139 §5 D2) writes nucpot-prod-{api,web,lightrag}:
            # candidate-<sha> at every build. Those tags are redundant with
            # the SHA-tagged image deploy-prod just promoted (same content)
            # and would otherwise accumulate at ~6 per 16 h (~13 GB/day
            # across the three repositories) — see NFM-3447 disk pressure.
            # Keep the most-recent 3 candidate tags per repository; remove
            # older entries via tools/prod-tag-retention/prune.sh.
            echo "==> Pruning candidate-* tags older than the last 3 per repository (NFM-3448)"
            for REPO in nucpot-prod-api nucpot-prod-lightrag nucpot-prod-web; do
              bash tools/prod-tag-retention/prune.sh --repo "$REPO" --keep 3
            done
            echo "==> Post-prune nucpot-prod-* tag count: $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -c '^nucpot-prod-')"
            echo "==> HEREDOC CUTOVER END (anchor for NFM-3777 diagnosis)"
          ENDSSH

      # NFM-3777-RECURRENCE-3 (issue #1050): every prior defense lived INSIDE
      # the deploy heredoc, so the same silent-skip that ate `docker compose
      # up -d` also ate the defenses. This assertion runs in the JOB context,
      # after the heredoc returns — it cannot be skipped by whatever eats the
      # heredoc's tail. If the containers are not running THIS run's SHA-tagged
      # image, the deploy is a phantom success and we fail loudly here.
      - name: Assert prod containers run this SHA (outside-heredoc cutover guard, NFM-3777/#1050)
        id: cutover-assert
        run: |
          set -euo pipefail
          # Non-interactive SSH shell (zsh) lacks /usr/local/bin where docker
          # lives on this host — same PATH fix the deploy heredoc applies.
          SSH_DOCKER='export PATH="/usr/local/bin:/usr/local/sbin:$PATH"; docker'
          EXPECTED="nucpot-prod-api:${{ github.sha }}"
          echo "Expected api image: ${EXPECTED}"
          ACTUAL=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key lwj04@127.0.0.1 \
            "${SSH_DOCKER} inspect nucpot-prod-api --format '{{.Config.Image}}'")
          echo "Actual api image:   ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::PHANTOM CUTOVER DETECTED (NFM-3777 pattern, issue #1050)."
            echo "::error::nucpot-prod-api is running ${ACTUAL} but this deploy built ${EXPECTED}."
            echo "::error::The deploy heredoc silently skipped its cutover segment; prod is on a stale image."
            echo "::error::Manual recovery: PROD_IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml --env-file docker/.env.prod up -d"
            exit 71
          fi
          # Same check for the other three nucpot-prod services (web/worker/lightrag)
          for SVC in nucpot-prod-web:web nucpot-prod-worker:api nucpot-prod-lightrag:lightrag; do
            CONTAINER="${SVC%%:*}"; REPO="nucpot-prod-${SVC##*:}"
            ACTUAL_SVC=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key lwj04@127.0.0.1 \
              "${SSH_DOCKER} inspect ${CONTAINER} --format '{{.Config.Image}}'")
            EXPECTED_SVC="${REPO}:${{ github.sha }}"
            echo "${CONTAINER}: expected ${EXPECTED_SVC}, actual ${ACTUAL_SVC}"
            if [ "${ACTUAL_SVC}" != "${EXPECTED_SVC}" ]; then
              echo "::error::PHANTOM CUTOVER: ${CONTAINER} on ${ACTUAL_SVC}, expected ${EXPECTED_SVC} (NFM-3777/#1050)"
              exit 72
            fi
          done
          echo "CUTOVER_ASSERT_OK: all 4 nucpot-prod containers on ${{ github.sha }}"

      - name: External smoke tests
        id: external-smoke-tests
        env:
          # Bypass the deploy proxy — these are public URLs accessible directly
          # GitHub Actions env var names are case-insensitive; do NOT add
          # lowercase duplicates (http_proxy / https_proxy) here.
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
        run: |
          # Retry loop: give Cloudflare Tunnel time to stabilize after container restart
          for i in 1 2 3; do
            curl -sf https://nucpot.dpdns.org/ > /dev/null && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "=== Frontend smoke ==="
          curl -f https://nucpot.dpdns.org/ | grep -q "NFMD" || exit 1

          echo "=== API health endpoint ==="
          # NFM-3317/#934: verify.* was returned to AutoVC (localhost:8002).
          # The main API is served through the main domain's /api route.
          curl -f https://nucpot.dpdns.org/api/v1/health || exit 1

          echo "=== API /potentials endpoint (key data route) ==="
          curl -sf https://nucpot.dpdns.org/api/v1/potentials -o /dev/null || exit 1

          echo "=== API /reference-values/pending-review endpoint ==="
          curl -sf https://nucpot.dpdns.org/api/v1/reference-values/pending-review -o /dev/null || exit 1

          echo "=== AutoVC (verify domain) health ==="
          # AutoVC owns verify.nucpot.dpdns.org; its health path is /api/health
          curl -sf https://verify.nucpot.dpdns.org/api/health -o /dev/null || exit 1

          echo "=== All external smoke tests passed ==="

      - name: Verify Celery workers
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key lwj04@127.0.0.1 \
            "export PATH=\"/usr/local/bin:\$PATH\" && docker exec nucpot-prod-worker celery -A nfm_db.services.celery_app:celery_app inspect active"

      # =======================================================================
      # NFM-2109 / ADR-KR3-A2: emit prod deploy-event fragment for the collector.
      #
      # Two-step durability hop: this step writes one JSONL line to a
      # per-run path on the runner, then the next step uploads it as a GHA
      # artifact. The collector workflow (prod-deploy-event-collector.yml)
      # downloads prod-deploy-event-* artifacts and appends to the master
      # JSONL on the Mac Studio.
      #
      # Constraints (ADR §Acceptance 1):
      # - Wrapped in EXIT trap per ADR-KR3-A1 C1/C2 (one line per run,
      #   even on unexpected exit).
      # - Never changes deploy-prod's exit code (set +e + the library's
      #   never-fail contract).
      # - if: always() so a failing SSH step / smoke step / celery verify
      #   still emits — that's failure mode 6.
      # - The marker file /tmp/nfmd_prod_health_passed is the prod analog
      #   of staging's first-poll gate; the deploy step writes it on success.
      # =======================================================================
      - name: Emit prod deploy-event fragment
        if: always()
        env:
          GITHUB_ACTOR_VAL: ${{ github.actor }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          GITHUB_RUN_ID_VAL: ${{ github.run_id }}
        run: |
          set +e
          # Constraint: never fail the deploy-prod job, even on a programming
          # error or missing marker file.
          FRAGMENT_DIR="$RUNNER_TEMP/prod-deploy-events"
          mkdir -p "$FRAGMENT_DIR"
          FRAGMENT_PATH="$FRAGMENT_DIR/${{ github.run_id }}.jsonl"

          # Compute outcome from earlier step outcomes.
          DEPLOY_OK="false"
          [ "${{ steps.deploy.outcome }}" = "success" ] && DEPLOY_OK="true"
          SMOKE_OK="false"
          [ "${{ steps.external-smoke-tests.outcome }}" = "success" ] && SMOKE_OK="true"
          SUCCESS="false"
          if [ "$DEPLOY_OK" = "true" ] && [ "$SMOKE_OK" = "true" ]; then
            SUCCESS="true"
          fi

          # First-poll gate: the deploy heredoc's internal API curl succeeded.
          # The marker file lives on the Mac Studio (same fs as the runner).
          FIRST_POLL="false"
          if [ -f /tmp/nfmd_prod_health_passed ]; then
            FIRST_POLL="true"
          fi

          _prod_emit() {
            # Source the library; it NEVER fails its caller (acceptance criterion 5).
            # Override NFMD_DEPLOY_EVENTS_PATH so the write lands in the fragment
            # dir, not the default repo-relative path. The library strips
            # control chars from environment names — "production" passes through
            # untouched.
            . "$GITHUB_WORKSPACE/scripts/lib/deploy_event.sh" || return 0
            NFMD_DEPLOY_EVENTS_PATH="$FRAGMENT_PATH" deploy_event_emit \
              --environment production \
              --triggered-by "${GITHUB_ACTOR_VAL:-unknown}" \
              --commit-sha "${GITHUB_SHA_VAL:-unknown}" \
              --first-pass-success "$1" \
              --health-gate-first-poll-passed "$2" \
              --rollback-triggered false \
              --skip-flag-used false \
              --duration-ms 0 \
              || return 0
            return 0
          }

          # ADR-KR3-A1 C1: arm-on-EXIT guarantees exactly one line per run,
          # even on an unexpected early exit between here and the upload step.
          trap '_prod_emit "$SUCCESS" "$FIRST_POLL"' EXIT

          _prod_emit "$SUCCESS" "$FIRST_POLL"
          exit 0

      - name: Upload prod deploy-event fragment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-deploy-event-${{ github.run_id }}
          path: ${{ runner.temp }}/prod-deploy-events/
          if-no-files-found: error

  # =============================================================================
  # Post-deployment
  # =============================================================================
  smoke-test:
    name: Smoke Tests (@smoke)
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    timeout-minutes: 20  # NFM-3321: watchdog — fail fast if smoke hangs (was 50+ min)
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers (NFM-3321)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: playwright-chromium-${{ runner.os }}-
      - name: Install Playwright browsers
        timeout-minutes: 15  # NFM-3321: fail fast on slow download (was 50+ min)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run @smoke E2E tests
        run: pnpm exec playwright test --project=chromium --grep "@smoke"
        env:
          E2E_TARGET: live
          BASE_URL: https://nucpot.dpdns.org
          API_BASE_URL: https://nucpot.dpdns.org
          CI: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ===========================================================================
  # C6.1.1 — Production durable producer (stage 1) — NFM-2110
  #
  # Hosted runner that assembles one §3.1 deploy-event JSON object via the
  # Python mirror (scripts/lib/deploy_event_emitter.py) and uploads it as a
  # GHA artifact named ``nfm-deploy-event-<run_id>-<attempt>.json`` with
  # 90-day retention. Stage 2 of C6.1.1 is a separate collector workflow
  # (NFM-2110 sibling) that downloads these artifacts and atomically appends
  # to the master JSONL on the Mac Studio.
  #
  # This job deliberately does NOT write to NFMD_DEPLOY_EVENTS_PATH — the
  # producer's only persistent output is the artifact. See ADR-KR3-A1 §C6.1
  # and ADR-KR3-A2 for the design rationale.
  # ===========================================================================
  emit-prod-event:
    name: Emit Production Deploy Event
    runs-on: ubuntu-latest
    # `deploy-prod` must be declared here, not merely referenced in `if:` —
    # the `needs` context exposes only *direct* dependencies, so the original
    # `needs: [smoke-test]` left `needs.deploy-prod.result` expanding to "" and
    # the guard below never actually fired (NFM-2119).
    needs: [deploy-prod, smoke-test]
    if: always() && needs.deploy-prod.result != 'skipped'
    permissions:
      # Required for the `gh api .../actions/runs/<id>` read below.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Compute deploy duration in milliseconds
        id: duration
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # NFM-2119: `github.run_started_at` is NOT a property of the `github`
          # context — it exists only on the `workflow_run` event payload. Actions
          # expands an unknown property to "" instead of erroring, so this read as
          # correct in review and then crashed fromisoformat() on every prod run,
          # skipping the emit step and losing the artifact entirely. Read the
          # authoritative run start from the REST API instead.
          RUN_STARTED_AT="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" \
            --jq '.run_started_at' 2>/dev/null || true)"
          export RUN_STARTED_AT
          python3 - <<'PY'
          import os
          from datetime import UTC, datetime

          raw = os.environ.get("RUN_STARTED_AT", "").strip()
          try:
              start = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              duration_ms = max(
                  int((datetime.now(UTC) - start).total_seconds() * 1000), 0
              )
          except ValueError:
              # duration_ms is a metric, never a control value. An unresolvable
              # run start degrades to the sentinel 0 so the deploy event is still
              # emitted and still uploaded (NFM-2119).
              print(f"::warning::unparseable run start {raw!r}; duration_ms=0")
              duration_ms = 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"duration_ms={duration_ms}\n")
          PY

      - name: Emit production deploy event to JSON file
        # A failure computing the duration metric must not suppress the event it
        # annotates — that is exactly how NFM-2119 lost the artifact.
        if: always()
        env:
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          TRIGGERED_BY: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # first_pass_success: True iff needs.smoke-test.result == 'success'
          # (ADR-KR3-A1 C6.1.1 — failure / skipped / cancelled all map to false).
          if [ "$SMOKE_RESULT" = "success" ]; then
            FIRST_PASS="true"
          else
            FIRST_PASS="false"
          fi

          python3 scripts/lib/deploy_event_emitter.py \
            --environment production \
            --triggered-by "$TRIGGERED_BY" \
            --commit-sha "$COMMIT_SHA" \
            --first-pass-success "$FIRST_PASS" \
            --health-gate-first-poll-passed false \
            --rollback-triggered false \
            --skip-flag-used false \
            --duration-ms "${{ steps.duration.outputs.duration_ms }}" \
            > deploy-event.json

      - name: Persist event as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nfm-deploy-event-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-event.json
          retention-days: 90
          if-no-files-found: error

  # ===========================================================================
  # S2: Deploy notification — GitHub issue + Feishu alert + auto-close
  # ===========================================================================
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [smoke-test, emit-prod-event]
    if: always() && github.event_name == 'push'
    permissions:
      issues: write
    steps:
      - name: Deploy result triage
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const sha = context.sha.slice(0, 7);
            const now = new Date().toISOString().slice(0, 19).replace('T', ' ');
            const deployResult = '${{ needs.smoke-test.result }}';

            if (deployResult === 'failure') {
              // Close stale deploy-failure issues
              const stale = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['deploy-failure'],
                state: 'open',
              });
              for (const old of stale.data) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: old.number,
                  state: 'closed',
                });
              }

              // Create new deploy-failure issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[DEPLOY-FAILED] Production deploy failed (${sha})`,
                body: `## Production Deployment Failed\n\n` +
                  `**Time**: ${now}\n` +
                  `**Commit**: \`${sha}\`\n` +
                  `**Deploy job**: failure\n` +
                  `**Smoke test**: ${deployResult}\n\n` +
                  `### Actions\n` +
                  `1. [View failed run](${runUrl})\n` +
                  `2. Check Docker containers: \`ssh lwj04@<host> docker ps\`\n` +
                  `3. Check Cloudflare Tunnel status\n` +
                  `4. Manual rollback (NFM-2148 / ADR-NFM-2139 §5 D1 — SHA-tagged): \`ssh lwj04@<host> PROD_IMAGE_TAG=<prev-sha> docker compose -f docker-compose.prod.yml --env-file docker/.env.prod up -d\` (no rebuild; \`<prev-sha>\` is the SHA of the last successful deploy event — see C6.1.1 / NFM-2110)\n` +
                  `5. This issue auto-closes on next successful deploy`,
                labels: ['deploy-failure'],
              });
            } else if (deployResult === 'success') {
              // Close open deploy-failure issues
              const stale = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['deploy-failure'],
                state: 'open',
              });
              for (const issue of stale.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `✅ **Deploy recovered** at ${now}\n\nGreen commit: \`${sha}\`\nClosing.`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }

              // Only create deploy-success issue on version tags
              if (context.ref.startsWith('refs/tags/v')) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `[DEPLOY-OK] Production ${context.ref} deployed (${sha})`,
                  body: `## Production Deployment Succeeded\n\n` +
                    `**Time**: ${now}\n` +
                    `**Tag**: ${context.ref}\n` +
                    `**Commit**: \`${sha}\`\n` +
                    `[View Run](${runUrl})`,
                  labels: ['deploy-success'],
                });
              }
            }

      - name: Send Feishu alert
        if: always()
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            SHA="${{ github.sha }}"

            if [ "${{ job.status }}" = "failure" ]; then
              TEMPLATE="red"
              TITLE="Deploy Failed"
            else
              TEMPLATE="green"
              TITLE="Deploy Succeeded"
            fi

            curl -sf -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d '{
                "msg_type": "interactive",
                "card": {
                  "header": {
                    "title": {"tag": "plain_text", "content": "'"$TITLE"'"},
                    "template": "'"$TEMPLATE"'"
                  },
                  "elements": [{
                    "tag": "markdown",
                    "content": "**NucPot '"$TITLE"'**\nTime: '"$TIMESTAMP"'\nSHA: `'"$SHA"'`\n[View Run]('"$RUN_URL"')\nResult: '"${{ needs.smoke-test.result }}"'"
                  }]
                }
              }' || true
          fi
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK }}
