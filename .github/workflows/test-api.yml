name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

jobs:
  test:
    name: API Tests with Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Enforce single alembic head (no forked migration graph)
        # Prevents a forked migration graph from merging again. `alembic heads`
        # is a pure graph operation (no DB/app import), so it runs fast and
        # catches "Multiple head revisions are present" before it can break
        # `alembic upgrade head` in the deployed container. See NFM-167.
        run: |
          set -euo pipefail
          heads=$(uv run alembic heads | grep -c '(head)' || true)
          echo "Alembic head count: ${heads}"
          if [ "${heads}" -ne 1 ]; then
            echo "::error::Forked alembic migration graph detected (${heads} heads). Unite the branches with 'alembic merge <head_a> <head_b>' before merging this PR (NFM-167)."
            uv run alembic heads
            exit 1
          fi
          echo "OK: exactly one alembic head"

      - name: Check schema backward compatibility (NFM-869)
        run: uv run python ../../scripts/check_schema_compat.py --schema src/nfm_db/schemas/ontology.py --baseline ../../.schema-baseline.json

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-report=json --cov-fail-under=80

      # NFM-2149 / ADR-NFM-2139 §5 D2: PR-time regression for the
      # pre-deploy-assert script. Tests run on ubuntu-latest (no Docker
      # needed) by stubbing `docker` on PATH with a shim that returns
      # canned responses. The full live-Docker smoke lives in
      # production-deployment.yml > pre-deploy-assert-smoke.
      - name: Run pre-deploy-assert unit tests (NFM-2149)
        # `uv run` so pytest comes from the project venv (system python3 has no pytest).
        run: |
          uv run pytest ../../tools/pre-deploy-assert-smoke/test_assert.py -v

      # Publishes the Cobertura XML for the KR-5 coverage aggregator (NFM-2047).
      # `always()` keeps a red run measurable: a run that fails the 80% gate
      # still has a real coverage number worth reporting.
      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-api-cobertura
          path: apps/api/coverage.xml
          if-no-files-found: error
          retention-days: 90

      # Companion JSON (NFM-2044) — same data, machines prefer JSON. The XML
      # is the aggregator's primary input; JSON is kept for downstream tools
      # that consume the coverage.py JSON form.
      - name: Upload coverage.json artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-api-json
          path: apps/api/coverage.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        if: always()
        with:
          file: apps/api/coverage.xml
          flags: api
          name: api-coverage
          fail_ci_if_error: false

  # NFM-2196 / NFM-2146 D3: PR-time regression for the deploy-lock invariant.
  # The default pytest run deselects integration tests via ``-m 'not integration'``
  # in apps/api/pyproject.toml, so the behavioral contract test that exercises
  # ``run_async_migrations()`` against a real Postgres never runs in CI. This
  # job spins up a Postgres 16 service, points ``NFM_TEST_DATABASE_URL`` at it,
  # and runs ``tests/test_deploy_lock.py`` with the integration marker respected
  # (overriding the project's default ``-m 'not integration'`` deselection).
  #
  # Two AC#2 contracts are proved here:
  # 1. ``test_run_async_migrations_holds_advisory_lock_during_execution`` —
  #    while env.py drives ``do_run_migrations`` on the migration's own async
  #    connection, a probe on a *separate* connection cannot acquire the same
  #    key. Pre-fix code (lock in transient psql session) → probe acquires.
  # 2. ``test_run_async_migrations_releases_lock_after_completion`` — the
  #    finally-block unlock frees the deploy lock so the next migrator proceeds.
  test-deploy-lock-pg:
    name: API Deploy-Lock (Postgres)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nfm
          POSTGRES_PASSWORD: nfm
          POSTGRES_DB: nfm_deploy_lock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NFM_TEST_DATABASE_URL: postgresql+asyncpg://nfm:nfm@localhost:5432/nfm_deploy_lock_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # Install psycopg[binary] for sync create_engine bridge. The project
      # ships only asyncpg; the deploy-lock tests use create_engine() with
      # postgresql+psycopg:// to open probe connections on separate sync
      # sessions. See test_deploy_lock.py::_sync_url().
      - name: Install psycopg[binary]
        run: uv pip install "psycopg[binary]"

      # Install pg_isready (postgresql-client). pg_isready is the deterministic
      # gate for waiting on the Postgres 16 service container; the service
      # ``--health-cmd`` runs inside the container and is not visible from the
      # runner's host namespace.
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Wait for Postgres to be reachable. ``5432:5432`` maps the container
      # port to host port 5432 deterministically; the service health check
      # runs inside the container, so pg_isready from the runner host is the
      # authoritative readiness gate. Fail loudly if Postgres never comes up.
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U nfm; then
              echo "Postgres ready"
              break
            fi
            echo "Waiting for Postgres (${i}/30)..."
            sleep 2
          done
          # Hard-fail if pg_isready never succeeded. Without this gate the job
          # silently proceeded to the test step, where every connection attempt
          # failed with ECONNREFUSED — the original 50-run red streak.
          pg_isready -h localhost -p 5432 -U nfm

      # Override the ``addopts = "-m 'not integration'"`` deselection in
      # apps/api/pyproject.toml by setting ``addopts=""`` on the CLI. This
      # runs the deploy-lock integration tests against the live PG service.
      # ``--no-cov`` keeps this job independent of the coverage gate.
      - name: Run deploy-lock behavioral tests
        run: |
          uv run pytest tests/test_deploy_lock.py -v --no-cov --override-ini="addopts="

      # NFM-4185 gate review: behavioral coverage of migration 080 (KG
      # orphan bridge). The execution-based suite in
      # tests/test_migration_080_kg_orphan_bridge.py runs the real
      # upgrade()/downgrade() against this job's live Postgres service —
      # pinning the fresh-database no-op, the materials-present /
      # anchors-absent state that was the pre-fix NOT NULL crash shape,
      # the prod-shape happy path, idempotency, and downgrade isolation.
      # Without this step the suite is skip-by-default (NFM-2032 opt-in
      # via NFM_TEST_DATABASE_URL) and no workflow executes it.
      # ``--no-cov`` keeps this job independent of the coverage gate.
      - name: Run migration-080 execution tests
        run: |
          uv run pytest tests/test_migration_080_kg_orphan_bridge.py -v --no-cov --override-ini="addopts="

  # NFM-3199: Restore parity test execution inside the standard backend CI
  # workflow now that .github/workflows/extraction-parity*.yml have been
  # removed (NFM-3193 / PR #808). Mirrors the invocation shape of the deleted
  # .github/workflows/extraction-parity-staging-cron.yml (NFM-2944 / PR #801):
  # -m parity marker, EXTRACTION_STUB_MODE=true env var (required for the
  # test_parity.py module guard to run rather than skip — see
  # apps/api/tests/test_parity.py:78), tests/test_parity.py path, --no-cov so
  # the 80% coverage gate in the `test` job above is not entangled.
  #
  # `continue-on-error` (NOT `|| true`) keeps parity failures visible without
  # gating merge — see ADR-0007 §3 phased promotion (NFM-2916). A real
  # `|| true` would force steps.parity.outcome to 'success' and silently mask
  # regressions; `continue-on-error` preserves the true outcome for the step
  # summary and artifact. `set -o pipefail` keeps pytest's exit code from
  # being masked by `tee`.
  parity:
    name: API V1/V2 Parity Harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      EXTRACTION_STUB_MODE: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run parity harness
        id: parity
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p parity-artifacts
          uv run --frozen python -m pytest \
            tests/test_parity.py \
            -m parity \
            --no-cov \
            -v --tb=short \
            2>&1 | tee parity-artifacts/parity-output.txt

      - name: Upload parity summary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-summary
          path: apps/api/parity-artifacts/parity-output.txt
          if-no-files-found: warn
          # 14 days >> AC-required 7. ADR-0007 §3 review window is one week;
          # doubling that gives reviewers headroom to inspect runs without
          # rushing to download.
          retention-days: 14

      - name: Step summary
        if: always()
        run: |
          echo "## V1/V2 Parity Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Outcome:** ${{ steps.parity.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** Download \`parity-summary\` from the run page (14-day retention)" >> $GITHUB_STEP_SUMMARY
