name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

jobs:
  frontend:
    name: Frontend — Lint, Type-check, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      # Web half of the KR-5 coverage artifact pair (NFM-2047). apps/web
      # emits an n/a stub Cobertura via scripts/emit-coverage-stub.mjs
      # (NFM-2045, ADR-KR5-1: no core web paths). The KR-5 aggregator
      # (NFM-2046) reads this file and treats the stub package as a zero-data
      # marker — see the exported `STUB_MARKER` constant in
      # apps/web/scripts/emit-coverage-stub.mjs. Now that KR-5.2 is in,
      # a missing file is a real failure and must redden CI.
      - name: Upload web coverage.xml artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-web-cobertura
          path: apps/web/coverage.xml
          if-no-files-found: error
          retention-days: 90

      - name: Build
        run: pnpm run build

  e2e:
    name: E2E Tests (Live)
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 20
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests against live site
        run: pnpm exec playwright test --project=chromium
        env:
          E2E_TARGET: live
          BASE_URL: https://nucpot.dpdns.org
          API_BASE_URL: https://verify.nucpot.dpdns.org
          CI: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  backend:
    name: Backend — Lint, Type-check, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Enforce single alembic head (no forked migration graph)
        run: |
          set -euo pipefail
          heads=$(uv run alembic heads | grep -c '(head)' || true)
          echo "Alembic head count: ${heads}"
          if [ "${heads}" -ne 1 ]; then
            echo "::error::Forked alembic migration graph detected (${heads} heads). Unite the branches with 'alembic merge <head_a> <head_b>' before merging this PR (NFM-167)."
            uv run alembic heads
            exit 1
          fi
          echo "OK: exactly one alembic head"

      - name: Lint (ruff)
        run: uv run ruff check src tests

# NFM-2491 / NFM-2234 AC: AST-based silent-exception guard. Walks
      # apps/api/src/**/*.py and classifies ast.Pass, lone ast.Expr(...),
      # and bare ast.Continue in except handlers. Emits ::error::
      # annotations and exits 1 on findings. The empty TOML allowlist on
      # main is acceptable per AC; calibration target is >=13 unsuppressed
      # findings. Supersedes the NFM-2219 wiring of scripts/check_silent_catch.py
      # (commit 22fdca6) per NFM-2234 AC: the old script is deleted by this
      # issue; the AC-mandated path is apps/api/scripts/check_silent_excepts.py.
      - name: silent-catch-ast
        run: python apps/api/scripts/check_silent_excepts.py
        working-directory: ${{ github.workspace }}

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Tests (pytest) with coverage (≥80%)
        run: uv run pytest

      # API half of the KR-5 coverage artifact pair (NFM-2047). ci.yml is the
      # canonical producer: one run emits both halves from the same commit, so
      # the aggregator can pair them without cross-run skew. `--cov-report=xml`
      # in apps/api/pyproject.toml guarantees the file, hence `error`.
      - name: Upload API coverage.xml artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-api-cobertura
          path: apps/api/coverage.xml
          if-no-files-found: error
          retention-days: 90

      - name: File size guard (≤1500 lines)
        run: |
          echo "Checking file sizes..."
          oversized=$(find src -name '*.py' -exec wc -l {} + | awk '$1 > 1500 && $2 != "total" {print $1, $2}')
          if [ -n "$oversized" ]; then
            echo "::error::Files exceeding 1500-line limit detected:"
            echo "$oversized"
            exit 1
          fi
          echo "OK: all Python files under 1500 lines"

      - name: Import-deps consistency check
        run: python scripts/check_imports_in_deps.py
        working-directory: ${{ github.workspace }}

  # ===========================================================================
  # Schema-drift guard (NFM-3372 / NFM-3377) — catch the kg_entity_types
  # class of defect: a SQLAlchemy model exists but no migration creates
  # the table. Spins up a clean Postgres, runs `alembic upgrade head`,
  # and diffs the resulting schema against Base.metadata. A non-empty
  # diff fails the build with greppable `DRIFT:` lines naming the
  # specific tables/columns. Wired into the same merge-gate workflow
  # that runs on push/PR/merge_group to `main` so this defect class
  # never reaches prod again (see NFM-3311 -> NFM-3349 -> NFM-3364/3369/3370).
  # ===========================================================================
  schema-drift-guard:
    name: Schema-drift Guard (Postgres)
    runs-on: ubuntu-latest
    needs: [backend]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nfm
          POSTGRES_PASSWORD: nfm
          # NFM-4169: the test database must match the canonical name
          # ``nfm_db`` because migration 073's bootstrap SQL hardcodes
          # it (the SQL is the production manual-psql path reflected
          # verbatim — see apps/api/migrations/sql/create_nfm_preview_role.sql).
          # The test DB is throwaway (CI service container, destroyed at
          # job end) so the name matches prod by convention; renaming
          # would require also parameterising the SQL against the new
          # env var, which is out of scope for the CI fix.
          POSTGRES_DB: nfm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NFM_DATABASE_URL: postgresql+asyncpg://nfm:nfm@localhost:5432/nfm_db
      # NFM-4169 / NFM-4122: migration 073 (create_nfm_preview_role) reads
      # ``NFMD_PREVIEW_DB_PASSWORD`` at upgrade time and refuses to run
      # without it. This CI Postgres is throwaway (the
      # ``nfm_db`` test database is destroyed at job end) so the
      # placeholder password has zero blast radius — the password is
      # only used to satisfy the migration's env-var pre-flight, not to
      # authenticate anyone against prod. Production pulls the real
      # value from docker/.env.prod via scripts/prod_migrate.sh.
      NFMD_PREVIEW_DB_PASSWORD: ci-nfm-preview-fixture-password-not-a-secret
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # ``compare_metadata`` is sync — use psycopg for the diff connection.
      # The async migrator in env.py uses asyncpg (already a project dep);
      # the script transparently strips ``+asyncpg`` and re-dials with
      # psycopg.
      - name: Install psycopg[binary] for sync diff connection
        run: uv pip install "psycopg[binary]"

      - name: Install postgresql-client for readiness gate
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U nfm; then
              echo "Postgres ready"
              break
            fi
            echo "Waiting for Postgres (${i}/30)..."
            sleep 2
          done
          pg_isready -h localhost -p 5432 -U nfm

      - name: Run schema-drift check
        # ``set -euo pipefail`` keeps the script's exit code visible through
        # ``tee`` so a failure is not masked by the log pipeline.
        # Working dir is apps/api per the job-level defaults so the script
        # can resolve ``../../scripts/check_schema_drift.py`` correctly.
        run: |
          set -euo pipefail
          uv run python ../../scripts/check_schema_drift.py

  # ===========================================================================
  # Docker Build Verification — catches missing deps before production deploy
  # ===========================================================================
  # This job rebuilds both production Dockerfiles (API + Web) to catch:
  # - pyproject.toml changes that add new Python deps not in Docker image
  # - Dockerfile syntax errors
  # - pnpm-lock.json vs Docker build mismatch
  # - pip install failures from missing system libraries
  # ===========================================================================
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend, schema-drift-guard]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        run: docker build -f docker/prod-api.Dockerfile -t nucpot-ci-api:verify .

      - name: Verify API image can start
        run: |
          # Quick smoke: import the app module inside the container
          docker run --rm nucpot-ci-api:verify \
            python -c "from nfm_db.main import app; print('✅ API app imports successfully')"

      - name: Build Web image
        run: docker build -f docker/web.Dockerfile -t nucpot-ci-web:verify .

      - name: Verify Web image can start
        run: |
          docker run --rm -e NODE_ENV=production nucpot-ci-web:verify \
            node -e "require('./apps/web/server.js')" &
          WEB_PID=$!
          sleep 5
          # Kill if still running (we just need to verify no startup crash)
          kill $WEB_PID 2>/dev/null || true
          echo "✅ Web image starts without error"

  # ===========================================================================
  # S1: CI Failure Triage — dedup, create issue, Feishu alert, auto-close
  # ===========================================================================
  ci-failure-triage:
    name: CI Failure Triage
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker-build, e2e, schema-drift-guard]
    if: failure() && github.event_name == 'push'
    permissions:
      issues: write
      actions: read
    steps:
      - name: Collect failure info & create/update issue
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const sha = context.sha.slice(0, 7);
            const now = new Date().toISOString().slice(0, 19).replace('T', ' ');

            // Determine which jobs failed
            const frontendResult = '${{ needs.frontend.result }}';
            const backendResult = '${{ needs.backend.result }}';
            const dockerBuildResult = '${{ needs.docker-build.result }}';
            const e2eResult = '${{ needs.e2e.result }}';

            const failed = [];
            if (frontendResult === 'failure') failed.push('Frontend');
            if (backendResult === 'failure') failed.push('Backend');
            if (dockerBuildResult === 'failure') failed.push('Docker-Build');
            if (e2eResult === 'failure') failed.push('E2E');

            if (failed.length === 0) {
              core.info('No jobs actually failed, skipping triage.');
              return;
            }

            const failedJobs = failed.join(', ');
            const title = `[CI-AUTO] ${failedJobs} failed (${sha})`;

            // Dedup (NFM-848 fix, 2026-08-16): match on the FAILED-JOBS SIGNATURE,
            // not the SHA. Previously every new failing SHA closed the old issue
            // and opened a new one, which made downstream agents (SRE → LE)
            // spawn a fresh worktree/branch per SHA for the SAME root cause
            // (NFM-3221 → NFM-3227 → NFM-3228 chain). With signature dedup,
            // a recurring failure appends to ONE open issue regardless of SHA.
            const signature = failedJobs;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['ci-failure'],
              state: 'open',
            });

            const match = existing.data.find(i =>
              i.title.startsWith(`[CI-AUTO] ${signature} failed`) ||
              i.title.includes(sha)
            );

            if (match) {
              // Append comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `⚠️ **Still failing** at ${now}\n\nFailed: ${failedJobs}\n[View Run](${runUrl})`
              });
              core.info(`Updated existing issue #${match.number}`);
            } else {
              // Close stale ci-failure issues ONLY when their failure signature
              // differs (NFM-848: same-signature issues must never be closed by
              // a newer SHA — that reset the dedup and respawned agent chains).
              for (const old of existing.data) {
                const sameSignature = old.title.startsWith(`[CI-AUTO] ${signature} failed`);
                if (sameSignature) continue;
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: old.number,
                  state: 'closed',
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: old.number,
                  body: `✅ Auto-closed: superseded by newer CI failure [#${0}](${runUrl}) on ${sha}.`
                });
                core.info(`Closed stale issue #${old.number}`);
              }

              // Create new issue
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: `## CI Failure — ${now}\n\n` +
                  `**Commit**: \`${sha}\`\n` +
                  `**Failed jobs**: ${failedJobs}\n` +
                  `**Branch**: \`${{ github.ref_name }}\`\n\n` +
                  `### Failed Jobs\n` +
                  `- Frontend: ${frontendResult}\n` +
                  `- Backend: ${backendResult}\n` +
                  `- Docker-Build: ${dockerBuildResult}\n` +
                  `- E2E: ${e2eResult}\n\n` +
                  `### Actions\n` +
                  `1. [View failed run](${runUrl})\n` +
                  `2. Download artifacts for detailed logs\n` +
                  `3. Fix or quarantine flaky tests\n` +
                  `4. This issue will auto-close when CI passes`,
                labels: ['ci-failure'],
              });
              core.info(`Created new issue #${newIssue.data.number}`);
            }

      - name: Send Feishu alert
        if: always() && failure()
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            SHA="${{ github.sha }}"
            FAILED_JOBS="Frontend=${{ needs.frontend.result }}, Backend=${{ needs.backend.result }}, Docker-Build=${{ needs.docker-build.result }}, E2E=${{ needs.e2e.result }}"
            # NFM-848: include Docker-Build in the alert (was silently omitted)

            curl -sf -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d '{
                "msg_type": "interactive",
                "card": {
                  "header": {
                    "title": {"tag": "plain_text", "content": "CI Failed"},
                    "template": "red"
                  },
                  "elements": [{
                    "tag": "markdown",
                    "content": "**NucPot CI failed**\nTime: '"$TIMESTAMP"'\nSHA: `'"$SHA"'`\n[View Run]('"$RUN_URL"')\nJobs: '"$FAILED_JOBS"'"
                  }]
                }
              }' || true
          fi
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK }}

  # ===========================================================================
  # S1b: Auto-close ci-failure issues when CI passes on new commit
  # ===========================================================================
  ci-recovery:
    name: CI Recovery — close stale issues
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker-build, e2e, schema-drift-guard]
    if: success() && github.event_name == 'push'
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Close all open ci-failure issues — CI is green now
            const sha = context.sha.slice(0, 7);
            const now = new Date().toISOString().slice(0, 19).replace('T', ' ');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['ci-failure'],
              state: 'open',
            });

            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **CI recovered** at ${now}\n\nGreen commit: \`${sha}\`\nClosing this issue.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.info(`Closed recovered issue #${issue.number}`);
            }

            if (issues.data.length === 0) {
              core.info('No open ci-failure issues to close.');
            }
