version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps) [no-issue]"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps) [no-issue]"
    # react and react-dom must keep EXACT version parity (enforced at
    # render/test time), and @types/react* follow them. Without grouping,
    # Dependabot raises partial bumps that fail every React test file with
    # "Incompatible React versions" (see PR #1358). Group them so they move
    # in one PR.
    groups:
      react-family:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    # Packages pinned by pnpm.overrides in the root package.json (NFM-781
    # security pinning) cannot be bumped by Dependabot alone — the root
    # override must be updated in the same commit or pnpm's frozen install
    # fails with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (see PR #864). Managed
    # manually: next, postcss, nanoid, js-yaml, brace-expansion, sharp.
    ignore:
      - dependency-name: "next"
      - dependency-name: "postcss"
      - dependency-name: "nanoid"
      - dependency-name: "js-yaml"
      - dependency-name: "brace-expansion"
      - dependency-name: "sharp"
      # @types packages of pinned runtimes follow the runtime pins
      - dependency-name: "@types/node"
      # NFM-4881 (CTO disposition A, 2026-09-15): MAJOR-only suppression —
      # minors/patches keep flowing. eslint 10 breaks the transitive
      # eslint-plugin-react under eslint-config-next@16.3.x; revisit when
      # eslint-config-next ships an eslint-10-compatible plugin set.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # NFM-4881: antd 6 is a UX-visible major (Drawer placement narrowing,
      # StepProps export removal); revisit when the product roadmap pulls
      # antd 6 → scoped migration epic with CPO/UX visual QA.
      - dependency-name: "antd"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps) [no-issue]"
