version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps) [no-issue]"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps) [no-issue]"
    # Packages pinned by pnpm.overrides in the root package.json (NFM-781
    # security pinning) cannot be bumped by Dependabot alone — the root
    # override must be updated in the same commit or pnpm's frozen install
    # fails with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (see PR #864). Managed
    # manually: next, postcss, nanoid, js-yaml, brace-expansion, sharp.
    ignore:
      - dependency-name: "next"
      - dependency-name: "postcss"
      - dependency-name: "nanoid"
      - dependency-name: "js-yaml"
      - dependency-name: "brace-expansion"
      - dependency-name: "sharp"
      # @types packages of pinned runtimes follow the runtime pins
      - dependency-name: "@types/node"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps) [no-issue]"
