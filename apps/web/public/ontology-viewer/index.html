<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#000000"/><meta name="description" content="OntoFuel 本体可视化 - Neo4j NVL"/><title>OntoFuel NVL Visualization</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Fira Sans','Droid Sans','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}</style><script>
/* NFM-1838: Intercept fetch to handle proxy 503 -> fallback_url transparently.
 * When /api/proxy/ontology/data returns 503 with { fallback_url: "..." },
 * transparently re-fetch from the fallback URL so the viewer sees a normal 200.
 * This runs before the bundled app and wraps window.fetch once. */
(function () {
  var PROXY_PATH = '/api/proxy/ontology/data';
  var originalFetch = window.fetch;
  window.fetch = function (input, init) {
    return originalFetch.call(this, input, init).then(function (response) {
      if (response.status === 503) {
        var url = (typeof input === 'string') ? input : (input && input.url ? input.url : '');
        if (url.indexOf(PROXY_PATH) !== -1) {
          return response.json().then(function (body) {
            var fallbackUrl = body && body.fallback_url;
            if (!fallbackUrl) {
              throw new Error('Proxy returned 503 without fallback_url');
            }
            return originalFetch.call(window, fallbackUrl, init);
          }).catch(function (parseErr) {
            if (parseErr && parseErr.message && parseErr.message.indexOf('Proxy returned') === 0) {
              throw parseErr;
            }
            throw new Error('Failed to parse 503 response body');
          });
        }
      }
      return response;
    });
  };
})();
</script>
<script>
/* NFM-3478 / NFM-4306 (BUG-28): viewer visual fix + non-invasive cytoscape capture.
 * NFM-4306 FINDING: the current vendored bundle renders the graph with NVL
 * (WebGL) — window.__Nvl_* globals, no DOM _cyreg — so the old script's
 * cytoscape capture could never succeed and its debug panel reported
 * "cy: NOT FOUND" forever in production (GitHub #1147). The capture below is
 * therefore defensive-only (harmless no-op on NVL bundles, still applies the
 * style/layout fix if a container-mounted cytoscape view returns). It detects
 * the cytoscape instance via:
 *   1. MutationObserver on #root — catches the canvas insertion on EVERY mount,
 *      including re-mounts after corpus or layout switches
 *   2. A bounded 1s retry scan for the first 60s to close mount-timing races
 * NFM-4306 REMOVED the previous Element.prototype._cyreg setter hook: after
 * cytoscape's destroy() deleted the accessor, the hook's backing value went
 * stale, so the viewer's re-mount (corpus/layout switch) silently failed and
 * the graph stopped responding to zoom/drag. We now only READ _cyreg, never
 * patch it. All NFM-3478 debug-panel reporting was also removed: the
 * production DOM must contain no NFM-3478 artifacts (BUG-28 AC#1).
 * If the viewer never mounts (no canvas AND no interactive controls inside
 * #root) within 45s, a friendly error overlay with a reload button is shown
 * instead of a blank frame (BUG-28 AC#3). */
(function () {
  if (typeof window === 'undefined' || typeof document === 'undefined') return;
  var MOUNT_TIMEOUT_MS = 45000;
  var SCAN_INTERVAL_MS = 1000;
  var SCAN_BUDGET = MOUNT_TIMEOUT_MS / SCAN_INTERVAL_MS;
  var cyFound = false;

  function applyNfm3478Styles(cy) {
    try {
      cy.style()
        .selector('node')
        .style({
          'width': 200,
          'height': 200,
          'background-color': '#0066FF',
          'background-opacity': 1,
          'background-fill': 'solid',
          'border-width': 4,
          'border-color': '#003366',
          'border-opacity': 1,
          'label': 'data(label)',
          'color': '#000000',
          'font-size': 24,
          'font-weight': 'bold',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'text-margin-y': 10,
          'text-wrap': 'wrap',
          'text-max-width': 200,
          'text-outline-color': '#FFFFFF',
          'text-outline-width': 3,
          'text-outline-opacity': 1,
          'min-zoomed-font-size': 12,
          'opacity': 1,
          'visibility': 'visible',
          'display': 'element',
          'events': 'yes',
          'ghost': 'no',
          'z-index': 10
        })
        .selector('node[type = "individual"]')
        .style({
          'background-color': '#FF8800',
          'border-color': '#993300',
          'shape': 'round-rectangle'
        })
        .selector('edge')
        .style({
          'width': 4,
          'line-color': '#333333',
          'line-opacity': 1,
          'target-arrow-shape': 'triangle',
          'target-arrow-color': '#0066FF',
          'source-arrow-color': '#0066FF',
          'arrow-scale': 2,
          'curve-style': 'bezier',
          'control-point-step-size': 40,
          'control-point-weights': '0.5',
          'opacity': 1,
          'visibility': 'visible',
          'display': 'element'
        })
        .update();
    } catch (err) {
      /* style override best-effort */
    }
  }

  function fitViewport(cy) {
    try {
      var nodeCount = cy.nodes().length;
      if (nodeCount === 0) return;
      var padding = nodeCount < 50 ? 200 : (nodeCount < 500 ? 80 : 40);
      cy.fit(undefined, padding);
    } catch (err) {
      /* fit is best-effort */
    }
  }

  function applyNfm3478Fix(cy) {
    if (!cy || cy.__nfm3478Applied) return;
    cy.__nfm3478Applied = true;
    applyNfm3478Styles(cy);
    // Re-apply styles after every add + every layout (viewer may overwrite between these).
    cy.on('add', 'node, edge', function () {
      try { applyNfm3478Styles(cy); } catch (err) { /* noop */ }
    });
    // After the viewer's own layout completes, re-run cose-bilkent with tile:true
    // + larger node repulsion so parallel edges spread enough to show their arrows.
    // Skip if the user picked a non-force-directed layout.
    cy.one('layoutstop', function () {
      try {
        var userLayout = cy._private && cy._private.layout && cy._private.layout.options && cy._private.layout.options.name;
        if (!userLayout) return;
        if (userLayout !== 'cose-bilkent' && userLayout !== 'cose' && userLayout !== 'fcose') return;
        cy.layout({
          name: 'cose-bilkent',
          animate: false,
          quality: 'default',
          randomize: false,
          fit: true,
          padding: 40,
          tile: true,
          idealEdgeLength: function () { return 140; },
          nodeRepulsion: function () { return 9000; },
          edgeElasticity: function () { return 0.45; },
          gravity: 0.25,
          numIter: 2500,
          componentSpacing: 80
        }).run();
      } catch (err) {
        /* follow-up re-layout best-effort; if user changes layout mid-flight, ignore */
      }
    });
    // Force a viewport fit on every layoutstop with generous padding (covers
    // every layout the user picks; small corpora otherwise cluster in a corner).
    cy.on('layoutstop', function () {
      applyNfm3478Styles(cy);
      fitViewport(cy);
    });
  }

  function registerCy(cy) {
    if (!cy) return false;
    cyFound = true;
    try { applyNfm3478Fix(cy); } catch (err) { /* capture must never break the viewer */ }
    return true;
  }

  function findCyIn(rootEl) {
    if (!rootEl) return null;
    var all = rootEl.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      var reg = all[i]._cyreg;
      if (reg && reg.cy) return reg.cy;
    }
    return null;
  }

  function observeRoot() {
    var root = document.getElementById('root');
    if (!root) { setTimeout(observeRoot, 50); return; }
    var mo = new MutationObserver(function (mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var m = mutations[i];
        for (var j = 0; j < m.addedNodes.length; j++) {
          var n = m.addedNodes[j];
          if (n && n.nodeType === 1) {
            var reg = n._cyreg;
            if (reg && reg.cy) { registerCy(reg.cy); continue; }
            var found = findCyIn(n);
            if (found) registerCy(found);
          }
        }
      }
    });
    mo.observe(root, { childList: true, subtree: true });
    // initial scan
    var initial = findCyIn(root);
    if (initial) registerCy(initial);
  }
  observeRoot();

  // Bounded retry scan — only needed to close the window between the deferred
  // bundle mounting cytoscape and a MutationObserver callback we might have
  // missed pre-#root. Stops once found or after the budget; the observer above
  // covers all later re-mounts (corpus/layout switches).
  var scanCount = 0;
  var periodicScan = setInterval(function () {
    scanCount++;
    var found = findCyIn(document.getElementById('root')) ||
      (window.cy && !window.cy.__nfm3478Applied ? window.cy : null);
    if (found) { registerCy(found); }
    if (cyFound || scanCount >= SCAN_BUDGET) clearInterval(periodicScan);
  }, SCAN_INTERVAL_MS);

  // BUG-28 AC#3: friendly init-failure state. Only when #root has neither a
  // canvas nor any interactive controls — i.e. the viewer app itself failed to
  // boot (blank frame). A rendered selector UI without a graph is a normal
  // pre-selection state, not an init failure.
  function viewerBooted() {
    var root = document.getElementById('root');
    if (!root) return false;
    if (root.querySelector('canvas')) return true;
    return !!root.querySelector('select, button, input');
  }
  setTimeout(function () {
    if (!cyFound && !viewerBooted()) showInitError();
  }, MOUNT_TIMEOUT_MS);

  function showInitError() {
    if (document.getElementById('nfm4306-init-error')) return;
    window.__NFM4306_INIT_FAILED = true;
    var overlay = document.createElement('div');
    overlay.id = 'nfm4306-init-error';
    overlay.setAttribute('role', 'alert');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:99998;display:flex;'
      + 'align-items:center;justify-content:center;background:rgba(255,255,255,0.97);'
      + 'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;'
      + 'color:#222;padding:24px;text-align:center;';
    var box = document.createElement('div');
    var heading = document.createElement('h2');
    heading.textContent = '图谱初始化失败';
    heading.style.cssText = 'font-size:20px;margin:0 0 8px;';
    var msg = document.createElement('p');
    msg.textContent = '本体图谱未能加载，可能是网络或服务暂不可用。';
    msg.style.cssText = 'font-size:14px;margin:0 0 16px;color:#555;';
    var retry = document.createElement('button');
    retry.textContent = '重新加载';
    retry.style.cssText = 'padding:8px 20px;font-size:14px;border:1px solid #0066FF;'
      + 'background:#0066FF;color:#fff;border-radius:4px;cursor:pointer;';
    retry.addEventListener('click', function () { window.location.reload(); });
    box.appendChild(heading);
    box.appendChild(msg);
    box.appendChild(retry);
    overlay.appendChild(box);
    if (document.body) document.body.appendChild(overlay);
  }
})();
</script>
