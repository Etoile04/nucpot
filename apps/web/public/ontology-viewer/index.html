/* NFM-1838: Intercept fetch to handle proxy 503 -> fallback_url transparently.
 * When /api/proxy/ontology/data returns 503 with { fallback_url: "..." },
 * transparently re-fetch from the fallback URL so the viewer sees a normal 200.
 * This runs before the bundled app and wraps window.fetch once. */
(function () {
  var PROXY_PATH = '/api/proxy/ontology/data';
  var originalFetch = window.fetch;
  window.fetch = function (input, init) {
    return originalFetch.call(this, input, init).then(function (response) {
      if (response.status === 503) {
        var url = (typeof input === 'string') ? input : (input && input.url ? input.url : '');
        if (url.indexOf(PROXY_PATH) !== -1) {
          return response.json().then(function (body) {
            var fallbackUrl = body && body.fallback_url;
            if (!fallbackUrl) {
              throw new Error('Proxy returned 503 without fallback_url');
            }
            return originalFetch.call(window, fallbackUrl, init);
          }).catch(function (parseErr) {
            if (parseErr && parseErr.message && parseErr.message.indexOf('Proxy returned') === 0) {
              throw parseErr;
            }
            throw new Error('Failed to parse 503 response body');
          });
        }
      }
      return response;
    });
  };
})();
</script>
<script>
/* NFM-3478: viewer visual fix - multigraph edge separation + faster default layout on large graphs.
 * The viewer is vendored (no source), so we hook cytoscape's per-element _cyreg registry
 * to intercept every cytoscape instance the moment it is created, then:
 *   1. Patch its style to spread parallel edges (curve-style bezier + control-point-step-size).
 *   2. If the graph has > 200 nodes, switch the default layout from cose-bilkent
 *      (O(n^2) force-directed, slow on dense corpora) to grid (O(n), deterministic, instant).
 * Both behaviors only kick in when cytoscape is available; if the bundle ever ships
 * without the registry hook (e.g. cytoscape version bump), this script no-ops silently. */
(function () {
  if (typeof window === 'undefined' || typeof document === 'undefined') return;
  var ELEMENT_PROTO = window.Element && window.Element.prototype;
  if (!ELEMENT_PROTO) return;
  var originalDescriptor = Object.getOwnPropertyDescriptor(ELEMENT_PROTO, '_cyreg');
  function defineSetter(setHook) {
    Object.defineProperty(ELEMENT_PROTO, '_cyreg', {
      configurable: true,
      enumerable: false,
      get: originalDescriptor ? originalDescriptor.get : function () { return this.__cyreg; },
      set: function (value) {
        setHook.call(this, value);
        if (value && value.cy) { try { applyNfm3478Fix(value.cy); } catch (err) { /* noop */ } }
      }
    });
  }
  if (!originalDescriptor) {
    defineSetter(function (value) { this.__cyreg = value; });
  } else if (originalDescriptor.set) {
    var origSet = originalDescriptor.set;
    defineSetter(function (value) { origSet.call(this, value); });
  } else {
    return;
  }
  function applyNfm3478Fix(cy) {
    if (!cy || cy.__nfm3478Applied) return;
    cy.__nfm3478Applied = true;
    try {
      cy.style()
        .selector('edge')
        .style({
          'curve-style': 'bezier',
          'control-point-step-size': 40,
          'control-point-weights': '0.5',
          'segment-distances': 20,
          'segment-weights': '0.5'
        })
        .selector('edge[?bend]')
        .style({ 'bend-shape': 'quadratic' })
        .update();
      var nodeCount = cy.nodes().length;
      if (nodeCount > 200) {
        var currentLayout = cy._private && cy._private.layout && cy._private.layout.options && cy._private.layout.options.name;
        if (currentLayout && (currentLayout === 'cose-bilkent' || currentLayout === 'cose' || currentLayout === 'fcose')) {
          try { cy.layout({ name: 'grid', animate: false, fit: true, padding: 30 }).run(); } catch (e) { /* layout swap best-effort */ }
        }
      }
      // NFM-3478 follow-up: Force Directed layout in viewer uses tile:false which packs nodes
      // densely and visually overlaps parallel edges. After viewer's own layout completes,
      // re-run cose-bilkent with tile:true + larger node repulsion + edges so parallel
      // edges spread enough to show their arrows. Skip if user picked a non-FD layout.
      cy.one('layoutstop', function () {
        try {
          var userLayout = cy._private && cy._private.layout && cy._private.layout.options && cy._private.layout.options.name;
          if (!userLayout) return;
          if (userLayout !== 'cose-bilkent' && userLayout !== 'cose' && userLayout !== 'fcose') return;
          cy.layout({
            name: 'cose-bilkent',
            animate: false,
            quality: 'default',
            randomize: false,
            fit: true,
            padding: 40,
            tile: true,
            idealEdgeLength: function () { return 140; },
            nodeRepulsion: function () { return 9000; },
            edgeElasticity: function () { return 0.45; },
            gravity: 0.25,
            numIter: 2500,
            componentSpacing: 80
          }).run();
        } catch (err) {
          /* follow-up re-layout best-effort; if user changes layout mid-flight, ignore */
        }
      });
    } catch (err) {
      /* cytoscape not ready or different bundle shape; silently skip */
    }
  }
  document.addEventListener('DOMContentLoaded', function () {
    var root = document.getElementById('root');
    if (root && root.__cyreg && root.__cyreg.cy) {
      try { applyNfm3478Fix(root.__cyreg.cy); } catch (err) { /* noop */ }
    }
  });
})();
</script>
